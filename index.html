<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>原型导航 · Prototypes</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; background:#F7F8FA; color:#1D2129; min-height:100vh; }
  .wrap { max-width:860px; margin:0 auto; padding:56px 24px; }
  h1 { font-size:26px; margin-bottom:8px; }
  .sub { color:#6B778C; font-size:14px; margin-bottom:32px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; }
  .card { display:block; background:#fff; border:1px solid #E5E7EB; border-radius:12px; padding:22px; text-decoration:none; color:inherit; transition:all .2s; }
  .card:hover { border-color:#155EEF; box-shadow:0 4px 12px rgba(0,0,0,.08); transform:translateY(-2px); }
  .card .icon { font-size:26px; margin-bottom:12px; }
  .card .name { font-size:16px; font-weight:600; margin-bottom:6px; }
  .card .desc { font-size:13px; color:#6B778C; line-height:1.6; }
  .card .go { display:inline-block; margin-top:14px; font-size:12px; color:#155EEF; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🧪 原型导航</h1>
  <p class="sub">交互原型 Demo 集合，点击卡片进入对应原型。</p>
  <div class="grid">
    <a class="card" href="./agent-module-library/">
      <div class="icon">🧩</div>
      <div class="name">智能体模块库</div>
      <div class="desc">模块的增删改查、安装到智能体、插入提示词引用、最终提示词预览全流程原型。</div>
      <span class="go">进入原型 →</span>
    </a>
  </div>
</div>
</body>
</html>
