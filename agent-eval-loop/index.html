        <div class="nav-label">上线前测试 · 主动运行用例</div>
        <nav class="nav-list" aria-label="测试导航">${navItem('tests','测试用例','tests',drafts)}${navItem('runs','测试任务','runs')}</nav>
        <div class="sidebar-foot"><div class="sidebar-help">${agent.hasProduction?`<strong>线上问题需要人工确认</strong>${pending} 个候选等待确认 · ${data.problems.filter(p=>p.status!=='已关闭').length} 个问题处理中`:'<strong>当前智能体尚未上线</strong>先准备并确认测试用例；产生真实客户对话后才会显示线上问题。'}</div></div>
      </aside>`;
    }

    function renderTopbar() {
      return `<header class="topbar"><div class="breadcrumbs"><span>${currentAgent().name}</span><span>/</span><span>测试与线上问题</span><span>/</span><span class="current">${pageTitle()}</span></div><div class="top-actions"><div class="search">${icon('search',15)}<span>搜索用例、批次或问题</span></div><button class="icon-btn" aria-label="通知">${icon('bell',16)}</button><div class="user-avatar">魏</div></div></header>`;
    }

    function metricCard(label,value,foot,delta,iconName,tone='') {
      return `<div class="card metric"><div class="metric-top"><span class="metric-label">${label}</span><span class="metric-icon">${icon(iconName,15)}</span></div><div class="metric-value">${value}</div><div class="metric-foot"><span class="${tone}">${delta}</span><span>${foot}</span></div></div>`;
    }

    function emptyRow(cols,text) {
      return `<tr><td colspan="${cols}"><div class="empty"><div><strong>${esc(text)}</strong></div></div></td></tr>`;
    }

    function testAssetTabs() {
      return `<div class="asset-tabs"><button class="asset-tab ${state.testView==='cases'?'active':''}" data-action="test-view" data-view="cases">测试用例</button><button class="asset-tab ${state.testView==='sets'?'active':''}" data-action="test-view" data-view="sets">评测集 <span class="section-meta">${currentSets().length}</span></button></div>`;
    }

    function renderTests() {
      const viewingSets=state.testView==='sets';
      if(viewingSets) return renderEvaluationSets();
      const tests=currentTests();
      const filtered=state.testTab==='待确认'?tests.filter(t=>['draft','pending'].includes(t.status)):tests;
      const promptOf=c=>c.interactionPrompt||c.question||c.expectedAnswer||'尚未填写用户提示';
      const criteriaOf=c=>(c.criteria&&c.criteria.length)?c.criteria.join('；'):(c.expectedAnswer||'尚未填写成功标准');
      return `<div class="page"><div class="page-head"><div class="page-head-copy"><h1>测试用例</h1><p class="page-sub">维护单条客户场景和判断条件；需要组合运行时，把已确认用例加入评测集。</p></div><div class="page-actions"><button class="btn primary" data-action="new-case">${icon('plus',15)}创建用例</button></div></div>${testAssetTabs()}
        ${tests.length?`<div class="toolbar"><div class="tabs">${['全部','待确认'].map(tab=>`<button class="tab ${state.testTab===tab?'active':''}" data-action="test-tab" data-tab="${tab}">${tab}</button>`).join('')}</div><div class="toolbar-spacer"></div><span class="section-meta">已确认 ${eligibleTests().length} 条 · 待确认 ${tests.filter(t=>t.status!=='ready').length} 条</span></div>
        <div class="card table-card"><div class="table-scroll"><table class="case-table"><thead><tr><th class="col-name">场景用例</th><th>用户提示</th><th>成功标准</th><th class="col-time">最近编辑</th><th class="col-ops">操作</th></tr></thead><tbody>${filtered.map(c=>{const ready=c.status==='ready';return `<tr data-action="${ready?'open-test':'edit-case'}" data-id="${c.id}" tabindex="0"><td class="col-name"><div class="cell-main">${esc(c.name||'未命名测试用例')}</div><div class="cell-sub">${esc(c.id||'尚未编号')} · ${esc(statusLabels[c.status]||'草稿')}${c.baselineCase?' · 回归基线':''}${sourceLabel(c.source)?' · '+esc(sourceLabel(c.source)):''}</div></td><td><div class="cell-clamp">${esc(promptOf(c))}</div></td><td><div class="cell-clamp">${esc(criteriaOf(c))}</div></td><td class="col-time"><div class="cell-sub" style="margin-top:0">${esc(c.updated||'刚刚')}</div></td><td class="col-ops"><div class="row-actions"><button class="btn small" data-action="edit-case" data-id="${c.id}">${icon('edit',13)}编辑</button><button class="btn small" data-action="retest-case" data-id="${c.id}" ${ready?'':'disabled'}>${icon('refresh',13)}测试</button><button class="btn small danger" data-action="delete-case" data-id="${c.id}">${icon('trash',13)}删除</button></div></td></tr>`}).join('')||emptyRow(5,'当前分类没有用例')}</tbody></table></div></div>`:`<section class="card empty"><div><h2>先创建第一条用例</h2><p>可以手动添加、手动导入、从生产通话提取、从其他智能体导入，也可以让 AI 自动生成。</p><button class="btn primary" data-action="new-case">${icon('plus',14)}创建用例</button></div></section>`}
      </div>`;
    }

    function renderEvaluationSets() {
      const sets=currentSets();
      return `<div class="page"><div class="page-head"><div class="page-head-copy"><h1>评测集</h1><p class="page-sub">把一组已确认用例保存为固定范围，用于专项评测、上线前检查或问题修复后的重复验证。</p></div><div class="page-actions"><button class="btn primary" data-action="new-set">${icon('plus',15)}新建评测集</button></div></div>${testAssetTabs()}
        <div class="notice" style="margin-bottom:12px"><span>${icon('tests',16)}</span><div><strong>评测集保存测试范围，不保存一次测试结果</strong><p>每次运行都会生成新的测试任务；以后增删评测集中的用例，不会改变历史任务和报告。</p></div></div>
        ${sets.length?`<div class="card table-card"><div class="table-scroll"><table class="set-table"><thead><tr><th>评测集</th><th>用途说明</th><th>关联用例</th><th>最近一次评测</th><th>最近编辑</th><th class="col-set-ops">操作</th></tr></thead><tbody>${sets.map(set=>{const cases=(set.caseIds||[]).map(getCase).filter(Boolean),ready=cases.filter(test=>test.status==='ready'),run=set.lastRunId?getRun(set.lastRunId):null,stats=run?runStats(run):null;return `<tr data-action="open-set" data-id="${set.id}" tabindex="0"><td><div class="cell-main">${esc(set.name)}</div><div class="cell-sub">${esc(set.id)} · ${esc(set.owner||'未指定负责人')}</div></td><td><div class="cell-clamp">${esc(set.description||'尚未填写用途说明')}</div></td><td><div class="cell-main">${ready.length} 条可运行</div><div class="cell-sub">共关联 ${cases.length} 条</div></td><td>${run?`<div class="cell-main">${stats.pass} 条处理正确</div><div class="cell-sub">${stats.fail+stats.review+stats.error} 条需要处理 · ${esc(run.time)}</div>`:'<span class="cell-sub">尚未运行</span>'}</td><td><span class="cell-sub">${esc(set.updated||'刚刚')}</span></td><td class="col-set-ops"><div class="row-actions"><button class="btn small" data-action="open-set" data-id="${set.id}">查看</button><button class="btn small primary" data-action="run-set" data-id="${set.id}" ${ready.length?'':'disabled'}>${icon('runs',13)}运行评测</button></div></td></tr>`;}).join('')}</tbody></table></div></div>`:`<section class="card empty"><div><h2>还没有评测集</h2><p>新建一个评测集，选择已经确认的测试用例，即可反复运行同一组评测。</p><button class="btn primary" data-action="new-set">${icon('plus',14)}新建评测集</button></div></section>`}
      </div>`;
    }

    function renderSetEditor() {
      const f=state.setForm;if(!f)return '';
      const selected=new Set(f.caseIds||[]),tests=currentTests(),ready=tests.filter(test=>test.status==='ready');
      const q=String(state.setCaseQuery||'').trim(),kw=q.toLowerCase();
      const shown=kw?tests.filter(test=>String(test.name||'').toLowerCase().includes(kw)||String(test.id||'').toLowerCase().includes(kw)):tests;
      const body=`<div class="form-grid"><div class="field full"><label>评测集名称 *</label><input class="input" data-set-field="name" value="${esc(f.name||'')}" placeholder="例如：上线前核心评测集"></div><div class="field full"><label>用途说明</label><textarea class="textarea" data-set-field="description" placeholder="说明这组用例在什么情况下运行，以及主要覆盖哪些业务问题">${esc(f.description||'')}</textarea></div><div class="field full"><label>选择测试用例 *</label><span class="hint">只有已经确认的用例可以加入评测集。当前已选择 ${selected.size} 条。</span><div style="margin-top:10px"><input class="input" data-set-search value="${esc(state.setCaseQuery||'')}" placeholder="搜索用例名称或编号"></div><div class="set-case-list" style="margin-top:8px">${shown.map(test=>{const canUse=test.status==='ready',checked=selected.has(test.id);return `<label class="check-item"><input class="check" type="checkbox" data-action="toggle-set-case" data-id="${test.id}" ${checked?'checked':''} ${canUse?'':'disabled'}><span class="check-copy"><strong>${esc(test.name)}</strong><span>${esc(test.id)} · ${canUse?'已确认，可以运行':'尚未确认，暂时不能加入评测集'}</span></span>${badge(canUse?'已确认':'待确认',canUse?'pass':'review')}</label>`;}).join('')||`<div class="empty"><p>${kw?`没有匹配“${esc(q)}”的用例。`:'当前还没有测试用例。'}</p></div>`}</div></div></div>`;
      const foot=`<button class="btn ghost" data-action="close-overlay">取消</button><span class="spacer"></span><span class="section-meta">${selected.size} / ${ready.length} 条已确认用例</span><button class="btn primary" data-action="save-set">${f.id?'保存修改':'创建评测集'}</button>`;
      return drawerShell(f.id?'编辑评测集':'新建评测集',f.id?`${f.id} · 修改只影响后续评测`:'选择一组可重复运行的测试用例',body,foot,true);
    }

    function renderSetDrawer(id) {
      const set=currentSets().find(item=>item.id===id);if(!set)return '';
      const cases=(set.caseIds||[]).map(getCase).filter(Boolean),ready=cases.filter(test=>test.status==='ready'),run=set.lastRunId?getRun(set.lastRunId):null,stats=run?runStats(run):null;
      const body=`<div class="notice"><span>${icon('tests',16)}</span><div><strong>${esc(set.description||'尚未填写用途说明')}</strong><p>负责人：${esc(set.owner||'未指定')} · 最近编辑：${esc(set.updated||'刚刚')}</p></div></div><div class="set-summary" style="margin:18px 0"><div><strong>${cases.length}</strong><div class="cell-sub">关联用例</div></div><div><strong>${ready.length}</strong><div class="cell-sub">当前可运行</div></div><div><strong>${run?stats.pass:'—'}</strong><div class="cell-sub">最近处理正确</div></div><div><strong>${run?stats.fail+stats.review+stats.error:'—'}</strong><div class="cell-sub">最近需要处理</div></div></div><div class="section-head"><div><div class="section-title">包含的测试用例</div><div class="section-meta">运行时使用每条用例的当前已确认版本</div></div></div><div class="set-case-list">${cases.map(test=>`<div class="set-case-row"><div><div class="cell-main">${esc(test.name)}</div><div class="cell-sub">${esc(test.id)} · ${esc((test.criteria||[]).join('；')||'尚未填写判断条件')}</div></div>${badge(statusLabels[test.status]||test.status,resultTone(test.status))}</div>`).join('')||'<div class="empty"><p>这个评测集还没有关联用例。</p></div>'}</div>${run?`<div class="snapshot-note">最近任务：${esc(run.name)} · ${esc(run.time)}。打开测试任务可查看每条用例的对话和判断证据。</div>`:''}`;
      const foot=`<button class="btn danger" data-action="delete-set" data-id="${set.id}">${icon('trash',13)}删除评测集</button><span class="spacer"></span><button class="btn" data-action="edit-set" data-id="${set.id}">${icon('edit',13)}编辑用例范围</button><button class="btn primary" data-action="run-set" data-id="${set.id}" ${ready.length?'':'disabled'}>${icon('runs',14)}运行这个评测集</button>`;
      return drawerShell(set.name,`${set.id} · ${ready.length} 条用例可运行`,body,foot,true);
    }
    function renderRuns() {
      const runs=currentRuns(),agent=currentAgent();
      return `<div class="page"><div class="page-head"><div class="page-head-copy"><h1>测试任务</h1><p class="page-sub">当前草稿始终通过调试接口运行。测试只针对草稿本身，按用例要求判断处理是否正确。</p></div></div>
      ${runs.length?`<div class="card table-card"><div class="table-scroll"><table><thead><tr><th>任务名称</th><th>被测智能体</th><th>被测版本</th><th>已完成范围</th><th>处理正确</th><th>处理有问题</th><th>待人工看</th><th>执行状态</th><th>时间</th></tr></thead><tbody>${runs.map(run=>{const s=runStats(run),setName=run.setName||(run.setId?currentSets().find(item=>item.id===run.setId)?.name:'');return `<tr data-action="open-report" data-id="${run.id}" tabindex="0"><td><div class="cell-main">${esc(run.name)}</div><div class="cell-sub">${run.id}${setName?` · 来自评测集：${esc(setName)}`:''}</div></td><td><div class="cell-main">${esc(run.agentName||agent.name)}</div><div class="cell-sub">测试副本</div></td><td>${esc(run.version)}</td><td>${s.total} / ${run.caseIds.length}</td><td><span style="color:var(--mint);font-weight:650">${s.pass}</span></td><td><span style="color:var(--red);font-weight:650">${s.fail}</span></td><td>${s.review+s.error}</td><td>${badge(run.executionStatus,resultTone(run.executionStatus))}</td><td>${esc(run.time)}</td></tr>`}).join('')}</tbody></table></div></div>`:`<section class="card empty"><div><h2>还没有测试任务</h2><p>先确认至少一条测试用例，再开始第一次测试。</p><button class="btn primary" data-nav="tests">前往测试用例</button></div></section>`}</div>`;
    }

    function renderDiscovery() {
      if(state.onlineView==='rules') return renderRules();
      const data=currentDB();
      const pending=data.candidates.filter(c=>c.status==='待复核');
      const observing=data.candidates.filter(c=>c.status==='继续观察');
      const accepted=data.candidates.filter(c=>['业务可以接受','当前处理可以接受'].includes(c.status));
      const systemProblems=data.problems.filter(p=>p.problemType==='system');
      const agentProblems=data.problems.filter(p=>p.problemType!=='system');
      const confirmedGroups=[['继续观察','证据不足继续观察'],['业务可接受','业务可以接受'],['系统问题','系统和工具问题'],['智能体问题','智能体提示词问题']];
      const toCandidate=list=>list.map(c=>({kind:'candidate',data:c}));
      const toProblem=list=>list.map(p=>({kind:'problem',data:p}));
      let rows=[];
      if(state.discoveryTab==='等待确认') rows=toCandidate(pending);
      else if(state.discoveryTab==='已经确认'){
        if(state.discoverySub==='业务可接受') rows=toCandidate(accepted);
        else if(state.discoverySub==='系统问题') rows=toProblem(systemProblems);
        else if(state.discoverySub==='智能体问题') rows=toProblem(agentProblems);
        else rows=toCandidate(observing);
      }else{
        rows=[...data.candidates.filter(c=>!c.problemId).map(c=>({kind:'candidate',data:c})),...data.problems.map(p=>({kind:'problem',data:p}))];
      }
      const nextOf=x=>x.status==='待复核'?'查看对话并判断':x.status==='继续观察'?'继续观察生产表现':x.status==='业务可以接受'||x.status==='当前处理可以接受'?'保留人工判断':x.caseId?'查看已生成用例':'保留人工判断';
      const nextProblem=p=>p.status==='已关闭'?'查看闭环证据':p.status==='待线上验证'?'确认线上表现并关闭':p.status==='待上线'?'上线并观察':p.status==='待整体回归'?'回归全部已确认用例':p.status==='待单条复测'?'单条复测':p.caseId?'继续修改并复测':'整理为测试用例';
      return `<div class="page"><div class="page-head"><div class="page-head-copy"><h1>线上问题</h1></div><div class="page-actions"><button class="btn" data-action="online-view" data-view="rules">${icon('shield',15)}线上检查规则 · ${data.rules.length}</button><button class="btn" data-action="open-discovery-settings">${icon('settings',15)}发现设置</button><button class="btn primary" data-action="analyze">${state.analysisRunning?icon('refresh',15)+'检查中…':icon('spark',15)+'检查最新对话'}</button></div></div>
      <div class="toolbar"><div class="tabs">${[['全部','全部'],['等待确认','等待确认'],['已经确认','已经确认']].map(([key,label])=>`<button class="tab ${state.discoveryTab===key?'active':''}" data-action="discovery-tab" data-tab="${key}">${label}</button>`).join('')}</div></div>
      ${state.discoveryTab==='已经确认'?`<div class="toolbar sub-toolbar"><div class="tabs sub">${confirmedGroups.map(([key,label])=>`<button class="tab ${state.discoverySub===key?'active':''}" data-action="discovery-subtab" data-tab="${key}">${label}</button>`).join('')}</div></div>`:''}
      <div class="card table-card"><div class="table-scroll"><table><thead><tr><th>问题</th><th>来源 / 修改对象</th><th>问题影响</th><th>影响范围 / 目标版本</th><th>当前状态</th><th>下一步</th></tr></thead><tbody>${rows.map(item=>{const x=item.data;if(item.kind==='candidate')return `<tr data-action="open-discovery" data-id="${x.id}" tabindex="0"><td><div class="cell-main">${esc(x.title)}</div><div class="cell-sub">${x.id} · 系统发现</div></td><td>${esc(x.ruleName||x.signal)}<div class="cell-sub">${esc(x.ruleType||'疑似性问题')} · ${esc(x.ruleVersion||'v1.0')}</div></td><td>${badge(x.risk,riskTone(x.risk))}</td><td>${x.sessions} 通<div class="cell-sub">占近期对话 ${x.rate}</div></td><td>${badge(x.status,x.status==='待复核'?'review':'info')}</td><td>${nextOf(x)}</td></tr>`;return `<tr data-action="open-problem" data-id="${x.id}" tabindex="0"><td><div class="cell-main">${esc(x.title)}</div><div class="cell-sub">${x.id} · 来源 ${esc(x.source)}</div></td><td>${esc(x.target)}</td><td>${badge(x.severity,riskTone(x.severity))}</td><td><div class="cell-main">${esc(x.targetVersion)}</div><div class="cell-sub">目标版本</div></td><td>${badge(x.status,resultTone(x.status))}</td><td>${nextProblem(x)}</td></tr>`}).join('')||emptyRow(6,'当前没有此类问题')}</tbody></table></div></div></div>`;
    }
    function renderRules() {
      const all=currentDB().rules;
      const filtered=all.filter(r=>state.ruleTab==='全部规则'?true:r.type===state.ruleTab);
      return `<div class="page"><div class="page-head"><div class="page-head-copy"><button class="btn ghost small" data-action="online-view" data-view="issues">← 返回线上问题</button><h1 style="margin-top:9px">线上检查规则</h1></div><div class="page-actions"><button class="btn" data-action="open-discovery-settings">${icon('settings',15)}发现设置</button><button class="btn primary" data-action="new-rule">${icon('plus',15)}新建检查规则</button></div></div>
      <div class="toolbar"><div class="tabs">${['全部规则','确定性问题','疑似性问题'].map(tab=>`<button class="tab ${state.ruleTab===tab?'active':''}" data-action="rule-tab" data-tab="${tab}">${tab}</button>`).join('')}</div></div>
      <div class="card table-card"><div class="table-scroll"><table><thead><tr><th>规则名称</th><th>问题类型</th><th>什么时候检查 / 什么情况下命中</th><th>需要展示的证据</th><th>来源 / 版本</th><th>命中后的处理</th></tr></thead><tbody>${filtered.map(r=>`<tr data-action="edit-rule" data-id="${r.id}" tabindex="0"><td><div class="cell-main">${esc(r.name)}</div><div class="cell-sub">${r.id}</div></td><td>${badge(r.type,r.type==='确定性问题'?'fail':'review')}</td><td><div class="cell-main">${esc(r.when)}</div><div class="cell-sub">${esc(r.hit)}</div></td><td>${esc(r.evidence)}<div class="cell-sub">数据：${esc(r.data)}</div></td><td>${esc(r.source)}<div class="cell-sub">${esc(r.version)}</div></td><td>${r.type==='确定性问题'?badge('直接形成线上问题','fail'):badge('进入等待人工确认','review')}</td></tr>`).join('')||emptyRow(6,'当前筛选下没有规则')}</tbody></table></div></div></div>`;
    }
    function renderReport() {
      const run=currentRuns().find(r=>r.id===state.reportId)||currentRuns()[0];
      if(!run) return `<div class="page"><section class="card empty"><div><h2>还没有测试结果</h2><p>从已确认的用例开始第一次测试。</p><button class="btn primary" data-nav="tests">前往测试用例</button></div></section></div>`;
      state.reportId=run.id;
      const s=runStats(run),gate=gateFor(run);
      const toneClass=gate.tone==='pass'?'pass':gate.tone==='fail'?'fail':'review';
      const visible=run.results;
      const rerunCount=run.results.filter(r=>effectiveResult(r)!=='pass').length;
      return `<div class="page"><div class="page-head"><div class="page-head-copy"><button class="btn ghost small" data-nav="runs">← 返回测试任务</button><h1 style="margin-top:9px">${esc(run.name)}</h1></div><div class="page-actions">${run.problemId?`<button class="btn" data-action="open-problem" data-id="${run.problemId}">查看关联线上问题</button>`:''}<button class="btn" data-action="export-run" data-id="${run.id}">导出结果</button>${rerunCount?`<button class="btn" data-action="rerun-failed" data-id="${run.id}">${icon('refresh',15)}重新测试需处理用例</button>`:''}</div></div>
      <section class="verdict-bar ${toneClass}">
        <div class="verdict-icon">${icon(gate.tone==='pass'?'check':'issues',18)}</div>
        <div class="verdict-copy"><div class="verdict-title">${gate.title}</div><div class="verdict-hint">${esc(gate.reason)}</div></div>
        <div class="verdict-metrics">
          <div class="vm ${s.pass?'pass':'muted'}"><span>处理正确</span><strong>${s.pass}</strong></div>
          <div class="vm ${s.fail?'fail':'muted'}"><span>处理有问题</span><strong>${s.fail}</strong></div>
          <div class="vm ${s.review?'review':'muted'}"><span>需要人工看</span><strong>${s.review}</strong></div>
          <div class="vm ${s.error?'review':'muted'}"><span>测试未完成</span><strong>${s.error}</strong></div>
        </div>
      </section>
      <section class="card table-card" style="margin-top:14px"><div class="table-scroll"><table><thead><tr><th>测试用例</th><th>当前草稿</th><th>人工状态</th><th>后续去向</th></tr></thead><tbody>${visible.map(r=>{const effective=effectiveResult(r);return `<tr data-action="open-result" data-id="${r.caseId}" data-result-id="${r.id}" tabindex="0"><td><div class="cell-main">${esc(r.caseName)}</div><div class="cell-sub">${r.caseId} · 多轮客户场景</div></td><td>${badge(businessResult(effective),resultTone(effective))}</td><td>${badge(r.humanStatus,r.humanStatus==='等待确认'?'review':'pass')}</td><td>${r.issueId?`修改任务 ${r.issueId}`:effective==='error'?'检查测试系统并复测':effective==='fail'?'等待人工确认':'保留结果'}</td></tr>`}).join('')||emptyRow(4,'本次没有测试结果')}</tbody></table></div></section></div>`;
    }

    function renderVariableRows() {
      return state.caseForm.variables.map(v=>`<div class="data-row"><input class="input" value="${esc(v.name)}" data-variable-field="name" data-id="${v.id}" aria-label="资料名称"><select class="select" data-variable-field="type" data-id="${v.id}"><option ${v.type==='文本'?'selected':''}>文本</option><option ${v.type==='数字'?'selected':''}>数字</option><option ${v.type==='布尔'?'selected':''}>布尔</option></select><input class="input" value="${esc(v.value)}" data-variable-field="value" data-id="${v.id}" aria-label="测试内容"><label class="tiny-check"><input class="check" type="checkbox" ${v.required?'checked':''} data-variable-field="required" data-id="${v.id}">必须填写</label><label class="tiny-check"><input class="check" type="checkbox" ${v.sensitive?'checked':''} data-variable-field="sensitive" data-id="${v.id}">隐藏</label><button class="kebab" data-action="remove-variable" data-id="${v.id}" aria-label="删除资料">${icon('close',14)}</button></div>`).join('');
    }

    function renderToolCard(tool) {
      return `<article class="tool-card"><div class="tool-card-head"><div class="tool-symbol">${icon('settings',15)}</div><div><div class="tool-name">${esc(tool.label)} ${badge(tool.mode==='blocked'?'不允许执行':'测试环境',tool.mode==='blocked'?'block':'review')}</div><div class="tool-id">${esc(tool.id)}</div></div><div class="tool-mode">${[['mock','使用设定结果'],['sandbox','连接测试系统'],['blocked','不允许执行']].map(([mode,label])=>`<button class="mode-btn ${tool.mode===mode?'active':''}" data-action="tool-mode" data-id="${tool.id}" data-mode="${mode}">${label}</button>`).join('')}</div></div>
      ${tool.mode==='mock'?`<div class="tool-card-body"><div class="form-grid"><div class="field"><label>测试时返回</label><select class="select" data-tool-field="outcome" data-id="${tool.id}"><option value="success" ${tool.outcome==='success'?'selected':''}>操作成功</option><option value="error" ${tool.outcome==='error'?'selected':''}>操作失败</option><option value="timeout" ${tool.outcome==='timeout'?'selected':''}>长时间没有结果</option></select></div><div class="field"><label>执行要求</label><select class="select" data-tool-field="assertion" data-id="${tool.id}"><option ${tool.assertion==='必须调用'?'selected':''}>必须调用</option><option ${tool.assertion==='允许调用'?'selected':''}>允许调用</option><option ${tool.assertion==='不得调用'?'selected':''}>不得调用</option></select></div></div></div>`:tool.mode==='sandbox'?`<div class="mock-state"><div class="notice warn"><span>${icon('shield',16)}</span><div><strong>开始前需要确认测试账号和权限</strong><p>新建任务时会单独显示这项安全检查。</p></div></div></div>`:`<div class="mock-state"><strong style="color:var(--red)">测试期间不允许执行；仍尝试执行会记为处理有问题。</strong></div>`}</article>`;
    }

    function renderCaseEditor() {
      const f=state.caseForm,editing=Boolean(f.id);
      if(!f.type) return `<div class="page editor-page"><div class="page-head"><div class="page-head-copy"><button class="btn ghost small" data-action="leave-editor">← 返回测试用例</button><h1 style="margin-top:9px">新建测试用例</h1><p class="page-sub">先选择要验证一个回答，还是验证一整段对话。选择后进入对应的整页表单。</p></div><div class="page-actions">${badge(`${currentAgent().draftVersion} · 当前草稿`,'accent')}${badge('尚未保存','review')}</div></div><section class="card editor-section" style="max-width:920px"><div class="editor-section-head"><div class="editor-section-icon">${icon('tests',16)}</div><div class="editor-section-copy"><h2>选择测试方式</h2><p>两种用例的输入和判断方法不同，保存后仍统一进入测试用例列表。</p></div></div><div class="editor-section-body"><div class="method-choice"><button class="method-card" data-action="case-type" data-type="fixed"><span class="method-card-icon">${icon('message',15)}</span><span><strong>单个问题</strong><small>输入一个客户问题，检查这一轮回答是否符合预期</small></span><span class="radio-mark"></span></button><button class="method-card" data-action="case-type" data-type="scenario"><span class="method-card-icon">${icon('spark',15)}</span><span><strong>完整对话</strong><small>用一段完整提示词模拟客户，检查事情最终有没有办好</small></span><span class="radio-mark"></span></button></div><div class="notice" style="margin-top:14px"><span>${icon('shield',16)}</span><div><strong>这不是增加一个创建步骤</strong><p>这里只负责分流。选择后仍在一个整页中上下滚动完成填写。</p></div></div></div></section></div>`;
      const isFixed=f.type==='fixed',typeLabel=isFixed?'单个问题':'完整对话';
      return `<div class="page editor-page"><div class="page-head"><div class="page-head-copy"><button class="btn ghost small" data-action="leave-editor">← 返回测试用例</button><h1 style="margin-top:9px">${editing?'编辑': '新建'}${typeLabel}</h1><p class="page-sub">${isFixed?'只发送一次客户问题，重点检查回答内容。':'用一段完整提示词模拟客户，允许对话根据智能体回复自然分支。'}</p></div><div class="page-actions">${editing?'':`<button class="btn small" data-action="reset-case-type">重新选择测试方式</button>`}<button class="btn small" data-action="fill-case-demo">填入示例</button>${badge(`${currentAgent().draftVersion} · 当前草稿`,'accent')}${badge(state.caseDirty?'有未保存修改':statusLabels[f.status],state.caseDirty?'review':'')}</div></div>
      <div class="editor-layout"><div class="editor-main"><section class="card editor-section"><div class="editor-section-head"><div class="editor-section-icon">${icon(isFixed?'message':'spark',16)}</div><div class="editor-section-copy"><h2>${isFixed?'问题与预期回答':'完整的客户模拟提示词'}</h2><p>${isFixed?'这一问会原样发送给智能体，只检查本轮回答。':'不拆成身份、目标、情绪等多个字段，直接用一段完整提示词定义模拟客户。'}</p></div></div><div class="editor-section-body"><div class="field full"><label>用例名称 *</label><input class="input" value="${esc(f.name)}" data-case-field="name" placeholder="${isFixed?'例如：奥迪 A4L 首次保养周期':'例如：价格追问与加微信报价'}"></div>
      ${isFixed?`<div class="subsection"><div class="field"><label>客户问题 *</label><textarea class="textarea" data-case-field="question" placeholder="输入客户会问的问题">${esc(f.question)}</textarea></div><div class="field" style="margin-top:12px"><label>预期回答 *</label><textarea class="textarea" style="min-height:140px" data-case-field="expectedAnswer" placeholder="写出参考回答，或写清楚回答必须包含的核心事实">${esc(f.expectedAnswer)}</textarea><span class="hint">预期回答本身就是主要判断依据，不必再重复填写一遍成功标准。</span></div><div class="field" style="margin-top:12px"><label>答案依据（可选）</label><input class="input" data-case-field="answerSource" value="${esc(f.answerSource||'')}" placeholder="例如：知识库 KB-2026.10 / 保养政策"></div></div>`:`<div class="subsection"><div class="field"><label>客户与智能体交互提示词 *</label><textarea class="textarea" style="min-height:250px" data-case-field="interactionPrompt" placeholder="在一个完整提示词中说明：客户是谁、想完成什么、第一次会怎么说、会提供哪些信息、如何根据智能体回复继续交流，以及何时结束。">${esc(f.interactionPrompt)}</textarea><span class="hint">系统会按这段完整提示词模拟客户。客户后续表达会根据智能体实际回复变化，不会照抄历史对话。</span></div><details style="margin-top:12px"><summary class="section-meta" style="cursor:pointer">运行设置</summary><div class="field" style="margin-top:10px;max-width:320px"><label>最多交流多少轮</label><input class="input" data-case-field="maxTurns" value="${esc(f.maxTurns||'10')}"></div></details></div>`}</div></section>
      <section class="card editor-section"><div class="editor-section-head"><div class="editor-section-icon">${icon('check',16)}</div><div class="editor-section-copy"><h2>${isFixed?'回答必须包含的要点（可选）':'怎样算事情办成 *'}</h2><p>${isFixed?'只有参考回答还不够清楚时再补充；每行一个关键要点。':'每行一条，结果页会逐条展示对话或系统操作证据。'}</p></div></div><div class="editor-section-body"><textarea class="textarea" style="min-height:120px" data-case-field="criteriaText" placeholder="${isFixed?'例如：同时说明时间和里程条件；说明以先到者为准':'每行一条事情办成的条件'}">${esc((f.criteria||[]).join('\n'))}</textarea></div></section>
      <section class="card editor-section"><div class="editor-section-head"><div class="editor-section-icon">${icon('issues',16)}</div><div class="editor-section-copy"><h2>${isFixed?'回答中不能出现什么（可选）':'哪些事情不能发生'}</h2><p>每行一条；出现任意一种，都需要在结果中明确标记。</p></div></div><div class="editor-section-body"><textarea class="textarea" data-case-field="avoidText" placeholder="${isFixed?'例如：不能引用已失效政策；不能编造统一优惠':'例如：系统失败时不能声称已经办理成功'}">${esc((f.avoid||[]).join('\n'))}</textarea></div></section>
      ${isFixed?`<details class="card editor-section" ${f.variables.length?'open':''}><summary class="editor-section-head" style="cursor:pointer"><div class="editor-section-icon">${icon('copy',16)}</div><div class="editor-section-copy"><h2>测试变量（可选）</h2><p>问题包含车型、地区或客户等级等动态内容时再使用。</p></div></summary><div class="editor-section-body"><button class="btn small" data-action="add-variable">${icon('plus',13)}添加变量</button><div style="margin-top:10px">${f.variables.length?`<div class="data-table"><div class="data-head"><span>变量名称</span><span>内容类型</span><span>测试值</span><span>必须填写</span><span>隐藏敏感内容</span><span></span></div>${renderVariableRows()}</div>`:'<p class="page-sub">当前没有测试变量。</p>'}</div></div></details>`:`<section class="card editor-section"><div class="editor-section-head"><div class="editor-section-icon">${icon('copy',16)}</div><div class="editor-section-copy"><h2>测试变量</h2><p>定义模拟客户可以使用的客户资料和业务字段。</p></div><button class="btn small" data-action="add-variable">${icon('plus',13)}添加变量</button></div><div class="editor-section-body">${f.variables.length?`<div class="data-table"><div class="data-head"><span>变量名称</span><span>内容类型</span><span>测试值</span><span>必须填写</span><span>隐藏敏感内容</span><span></span></div>${renderVariableRows()}</div>`:'<p class="page-sub">当前没有测试变量；需要时再添加。</p>'}</div></section>`}
      ${isFixed?`<details class="card editor-section" ${f.tools.length?'open':''}><summary class="editor-section-head" style="cursor:pointer"><div class="editor-section-icon">${icon('settings',16)}</div><div class="editor-section-copy"><h2>模拟系统调用（可选）</h2><p>只有这一问需要查询价格、库存或订单时才设置。</p></div></summary><div class="editor-section-body"><button class="btn small" data-action="add-tool">${icon('plus',13)}添加模拟调用</button><div class="tool-stack" style="margin-top:10px">${f.tools.map(renderToolCard).join('')||'<p class="page-sub">当前问题不需要调用业务系统。</p>'}</div></div></details>`:`<section class="card editor-section"><div class="editor-section-head"><div class="editor-section-icon">${icon('settings',16)}</div><div class="editor-section-copy"><h2>模拟系统调用</h2><p>定义测试时调用哪些业务系统，以及返回成功、失败或超时。</p></div><button class="btn small" data-action="add-tool">${icon('plus',13)}添加模拟调用</button></div><div class="editor-section-body"><div class="tool-stack">${f.tools.map(renderToolCard).join('')||'<p class="page-sub">当前用例不涉及模拟系统调用。</p>'}</div></div></section>`}
      <div id="case-form-error"></div><div class="editor-savebar"><button class="btn ghost" data-action="leave-editor">取消</button><button class="btn" data-action="save-case-draft">保存草稿</button><span class="spacer"></span><button class="btn" data-action="try-case">${icon('runs',14)}先试一次</button><button class="btn primary" data-action="save-case">${editing&&f.status==='ready'?'保存修改':'保存并确认'}</button></div></div>
      <aside class="editor-aside"><section class="card aside-card"><div class="aside-title">用例状态</div><div class="gate-line"><span>当前状态</span><strong>${statusLabels[f.status]}</strong></div><div class="gate-line"><span>测试方式</span><strong>${typeLabel}</strong></div><div class="gate-line"><span>判断依据</span><strong>${isFixed?1+f.criteria.length:f.criteria.length} 条</strong></div><div class="gate-line"><span>禁止事项</span><strong>${f.avoid.length} 条</strong></div><div class="gate-line"><span>测试变量</span><strong>${f.variables.length} 项</strong></div><div class="gate-line"><span>模拟系统调用</span><strong>${f.tools.length} 项</strong></div></section><div class="notice success"><span>${icon('shield',16)}</span><div><strong>不会直接影响真实客户</strong><p>试测只使用当前编辑内容和模拟系统结果，不会自动保存用例。</p></div></div></aside></div></div>`;
    }

    function renderScenarioCaseEditor() {
      const f=state.caseForm,editing=Boolean(f.id);
      if(!editing&&!f.creationMode) return `<div class="page editor-page"><div class="page-head"><div class="page-head-copy"><button class="btn ghost small" data-action="leave-editor">← 返回测试用例</button><h1 style="margin-top:9px">创建用例</h1><p class="page-sub">选择最适合当前素材的创建方式。批量生成或导入的内容都会先进入“待确认”，人工核对后才参加正式测试。</p></div></div><section class="card editor-section" style="max-width:1080px"><div class="editor-section-head"><div class="editor-section-icon">${icon('tests',16)}</div><div class="editor-section-copy"><h2>选择创建方式</h2><p>所有方式最终生成同一种多轮测试用例，只是素材来源不同。</p></div></div><div class="editor-section-body"><div class="creation-source-grid"><button class="method-card" data-action="case-source" data-source="manual"><span class="method-card-icon">${icon('plus',15)}</span><span><strong>手动添加</strong><small>在页面中填写客户模拟说明、判断条件、变量和模拟系统调用</small></span><span class="radio-mark"></span></button><button class="method-card" data-action="case-source" data-source="manual-import"><span class="method-card-icon">${icon('copy',15)}</span><span><strong>手动导入</strong><small>复制提示词让其他 AI 生成标准 JSON，再上传文件批量导入</small></span><span class="radio-mark"></span></button><button class="method-card" data-action="case-source" data-source="history"><span class="method-card-icon">${icon('discover',15)}</span><span><strong>从生产通话提取</strong><small>选择租户内的生产智能体，从真实通话中提取测试用例</small></span><span class="radio-mark"></span></button><button class="method-card" data-action="case-source" data-source="agent-import"><span class="method-card-icon">${icon('agents',15)}</span><span><strong>从其他智能体导入</strong><small>选择租户内的其他智能体，复用它已经维护的测试用例</small></span><span class="radio-mark"></span></button><button class="method-card" data-action="case-source" data-source="ai-generate"><span class="method-card-icon">${icon('spark',15)}</span><span><strong>AI 自动生成</strong><small>说明业务范围并设置数量，由 AI 生成一批待确认用例</small></span><span class="radio-mark"></span></button></div></div></section></div>`;

      if(!editing&&f.creationMode==='manual-import') {
        const imported=f.importCases||[];
        return `<div class="page editor-page"><div class="page-head"><div class="page-head-copy"><button class="btn ghost small" data-action="back-to-case-source">← 重新选择创建方式</button><h1 style="margin-top:9px">手动导入用例</h1><p class="page-sub">先把下面的提示词交给其他 AI 生成 JSON 文件，再把文件导入这里。</p></div><div class="page-actions">${badge('JSON 批量导入','accent')}${badge(imported.length?`已识别 ${imported.length} 条`:'等待选择文件',imported.length?'success':'review')}</div></div><div class="editor-layout"><div class="editor-main"><section class="card editor-section"><div class="editor-section-head"><div class="editor-section-icon">${icon('spark',16)}</div><div class="editor-section-copy"><h2>1. 复制给其他 AI 的提示词</h2><p>把业务资料连同这段提示词一起发给任意 AI，它会按本页面可识别的格式生成文件内容。</p></div><button class="btn small" data-action="copy-import-prompt">${icon('copy',13)}复制提示词</button></div><div class="editor-section-body"><textarea class="textarea" style="min-height:240px" readonly>${esc(manualImportPrompt)}</textarea><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn small" data-action="download-json-template">下载 JSON 模板</button><button class="btn ghost small" data-action="load-import-example">查看示例导入结果</button></div></div></section><section class="card editor-section"><div class="editor-section-head"><div class="editor-section-icon">${icon('copy',16)}</div><div class="editor-section-copy"><h2>2. 导入 JSON 文件</h2><p>系统会先检查格式并展示识别结果，不会直接加入正式测试。</p></div></div><div class="editor-section-body"><label class="field full"><span>选择 JSON 文件</span><input class="input" type="file" accept=".json,application/json" data-case-import-file><span class="hint">${f.importFileName?`已读取：${esc(f.importFileName)}`:'仅支持 .json 文件；文件中可包含一条或多条用例。'}</span></label>${f.importError?`<div class="notice warn" style="margin-top:12px"><span>${icon('issues',16)}</span><div><strong>文件暂时无法导入</strong><p>${esc(f.importError)}</p></div></div>`:''}${imported.length?`<div class="card card-pad" style="margin-top:14px"><strong>已识别 ${imported.length} 条用例</strong><div style="margin-top:10px">${imported.slice(0,5).map(item=>`<div class="gate-line"><span>${esc(item.name)}</span><strong>${item.criteria.length} 条判断条件</strong></div>`).join('')}${imported.length>5?`<p class="page-sub">另有 ${imported.length-5} 条未展开显示</p>`:''}</div></div>`:'<div class="empty" style="margin-top:14px"><p>选择文件后，这里会显示识别出的用例。</p></div>'}</div></section><div class="editor-savebar"><button class="btn ghost" data-action="back-to-case-source">取消</button><span class="spacer"></span><button class="btn primary" data-action="import-json-cases" ${imported.length?'':'disabled'}>导入 ${imported.length||0} 条用例</button></div></div><aside class="editor-aside"><div class="notice success"><span>${icon('shield',16)}</span><div><strong>导入后先人工确认</strong><p>导入内容会进入“待确认”，不会自动参加测试。</p></div></div><section class="card aside-card"><div class="aside-title">格式检查</div><div class="gate-line"><span>用例名称</span><strong>必须填写</strong></div><div class="gate-line"><span>客户模拟提示词</span><strong>必须填写</strong></div><div class="gate-line"><span>判断条件</span><strong>建议填写</strong></div><div class="gate-line"><span>变量与模拟调用</span><strong>可以为空</strong></div></section></aside></div></div>`;
      }

      if(!editing&&f.creationMode==='agent-import') {
        const source=tenantAgentCaseSources.find(agent=>agent.id===f.otherAgentId)||tenantAgentCaseSources[0];
        const selected=f.otherAgentCaseIds||[];
        const sourceSets=source.sets||[];
        const activeSet=sourceSets.find(item=>item.id===f.otherAgentSetId)||null;
        const q=String(state.agentCaseQuery||'').trim(),kw=q.toLowerCase();
        const rows=source.cases.map((item,index)=>({item,index})).filter(({item})=>!kw||String(item.name||'').toLowerCase().includes(kw)||String(item.prompt||'').toLowerCase().includes(kw));
        const allSelected=source.cases.length>0&&selected.length===source.cases.length;
        return `<div class="page editor-page"><div class="page-head"><div class="page-head-copy"><button class="btn ghost small" data-action="back-to-case-source">← 重新选择创建方式</button><h1 style="margin-top:9px">从其他智能体导入</h1><p class="page-sub">选择租户内的智能体，可以逐条挑选用例，也可以直接导入它已经维护好的评测集。</p></div><div class="page-actions">${badge(`${source.status} · ${source.version}`,'accent')}${badge(`已选 ${selected.length} 条`,selected.length?'success':'review')}</div></div><div class="editor-layout no-aside"><div class="editor-main"><section class="card editor-section"><div class="editor-section-head"><div class="editor-section-icon">${icon('agents',16)}</div><div class="editor-section-copy"><h2>选择用例来源</h2><p>这里只读取其他智能体已经维护的测试用例和评测集，不读取它的生产通话。</p></div></div><div class="editor-section-body"><div style="display:flex;gap:16px;flex-wrap:wrap"><div class="field" style="flex:1 1 300px;max-width:460px"><label>租户内的智能体</label><select class="select" data-case-field="otherAgentId">${tenantAgentCaseSources.map(agent=>`<option value="${agent.id}" ${source.id===agent.id?'selected':''}>${esc(agent.name)} · ${agent.version} · ${agent.status}</option>`).join('')}</select></div><div class="field" style="flex:1 1 240px;max-width:320px"><label>来源范围</label><select class="select" data-case-field="otherAgentSetId"><option value="">全部用例 · ${source.cases.length} 条</option>${sourceSets.map(set=>`<option value="${set.id}" ${f.otherAgentSetId===set.id?'selected':''}>评测集 · ${esc(set.name)} · ${set.caseIndexes.length} 条</option>`).join('')}</select>${activeSet?'':'<span class="hint">选择评测集会一次性勾选它包含的用例。</span>'}</div></div></div></section><section class="card editor-section"><div class="editor-section-head"><div class="editor-section-icon">${icon('tests',16)}</div><div class="editor-section-copy"><h2>选择测试用例</h2><p>导入的是一份独立副本，后续修改不会影响来源智能体。</p></div><label style="margin-left:auto;flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)"><input class="check" type="checkbox" data-action="toggle-all-agent-cases" ${allSelected?'checked':''} ${source.cases.length?'':'disabled'}>全选</label></div><div class="editor-section-body"><input class="input" data-agent-case-search value="${esc(state.agentCaseQuery||'')}" placeholder="搜索用例名称或描述">${activeSet?`<span class="hint" style="display:block;margin-top:8px">已按评测集「${esc(activeSet.name)}」选中 ${activeSet.caseIndexes.length} 条，可以继续手动增减。</span>`:''}<div class="tool-stack" style="margin-top:10px">${rows.map(({item,index})=>{const caseId=`${source.id}-${index}`,checked=selected.includes(caseId);return `<label class="check-item"><input class="check" type="checkbox" data-action="toggle-agent-case" data-id="${caseId}" ${checked?'checked':''}><span class="check-copy"><strong>${esc(item.name)}</strong><span>${esc(item.prompt)}</span></span></label>`;}).join('')||`<div class="empty"><p>${kw?`没有匹配“${esc(q)}”的用例。`:'这个智能体还没有可导入的用例。'}</p></div>`}</div></div></section><div class="editor-savebar"><button class="btn ghost" data-action="back-to-case-source">取消</button><span class="spacer"></span><button class="btn primary" data-action="import-agent-cases" ${selected.length?'':'disabled'}>导入 ${selected.length} 条用例</button></div></div></div></div>`;
      }

      if(!editing&&f.creationMode==='ai-generate') {
        const count=Math.max(1,Math.min(20,Number(f.aiCount)||5));
        return `<div class="page editor-page"><div class="page-head"><div class="page-head-copy"><button class="btn ghost small" data-action="back-to-case-source">← 重新选择创建方式</button><h1 style="margin-top:9px">AI 自动生成用例</h1><p class="page-sub">告诉 AI 想覆盖的业务范围并设置数量，生成结果会先进入“待确认”。</p></div><div class="page-actions">${badge('AI 生成','accent')}${badge(`预计生成 ${count} 条`,'review')}</div></div><div class="editor-layout"><div class="editor-main"><section class="card editor-section"><div class="editor-section-head"><div class="editor-section-icon">${icon('spark',16)}</div><div class="editor-section-copy"><h2>设置生成范围</h2><p>业务说明可以留空；留空时会根据当前智能体的配置生成常见客户场景。</p></div></div><div class="editor-section-body"><div class="field full"><label>想生成哪些用例（可选）</label><textarea class="textarea" style="min-height:150px" data-case-field="aiBrief" placeholder="例如：围绕报价、拒绝留资、试驾预约失败和明确要求转人工，覆盖正常流程与异常流程。">${esc(f.aiBrief||'')}</textarea></div><div class="field" style="max-width:320px;margin-top:14px"><label>生成条数</label><input class="input" type="number" min="1" max="20" data-case-field="aiCount" value="${count}"><span class="hint">一次最多生成 20 条，生成后可逐条删除或修改。</span></div></div></section><div class="editor-savebar"><button class="btn ghost" data-action="back-to-case-source">取消</button><span class="spacer"></span><button class="btn primary" data-action="generate-ai-cases">${icon('spark',14)}生成 ${count} 条用例</button></div></div><aside class="editor-aside"><div class="notice warn"><span>${icon('shield',16)}</span><div><strong>AI 生成不等于业务确认</strong><p>生成后需要检查客户设定、判断条件、变量和模拟系统结果。</p></div></div></aside></div></div>`;
      }

      if(!editing&&f.creationMode==='history') {
        const source=productionSourceAgents.find(agent=>agent.id===f.sourceAgentId)||productionSourceAgents[0];
        const count=Math.max(1,Math.min(20,Number(f.historyCount)||5));
        return `<div class="page editor-page"><div class="page-head"><div class="page-head-copy"><button class="btn ghost small" data-action="back-to-case-source">← 重新选择创建方式</button><h1 style="margin-top:9px">从生产通话提取用例</h1><p class="page-sub">选择通话来源和范围，由系统生成用例草稿；生成后逐条核对，不直接进入正式测试。</p></div><div class="page-actions">${badge('生产通话 · 只读提取','success')}${badge(`预计生成 ${count} 条草稿`,'review')}</div></div>
        <div class="editor-layout"><div class="editor-main"><section class="card editor-section"><div class="editor-section-head"><div class="editor-section-icon">${icon('discover',16)}</div><div class="editor-section-copy"><h2>告诉系统从哪些通话中提取</h2><p>可用一句业务化的要求缩小范围，也可以只使用下面的筛选条件。</p></div></div><div class="editor-section-body"><div class="field full"><label>想提取什么场景（可选）</label><textarea class="textarea" style="min-height:110px" data-case-field="historyInstruction" placeholder="例如：从最近客户明确要求人工、预约失败或反复追问的问题中，提取能够重复测试的客户场景">${esc(f.historyInstruction||'从最近未解决、转人工或系统操作异常的通话中，提取有代表性的客户场景')}</textarea></div><div class="form-grid" style="margin-top:14px"><div class="field"><label>生产智能体 *</label><select class="select" data-case-field="sourceAgentId">${productionSourceAgents.map(agent=>`<option value="${agent.id}" ${source.id===agent.id?'selected':''}>${esc(agent.name)} · ${agent.version}</option>`).join('')}</select><span class="hint">只读取所选生产智能体的通话历史，不会运行该智能体。</span></div><div class="field"><label>通话时间范围</label><select class="select" data-case-field="historyRange">${['最近 7 天','最近 30 天','最近 90 天'].map(x=>`<option ${f.historyRange===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>生成多少条场景草稿</label><input class="input" type="number" min="1" max="20" data-case-field="historyCount" value="${count}"><span class="hint">系统会合并高度相似的通话，不按每通对话机械生成一条。</span></div></div></div></section>
        <div class="editor-savebar"><button class="btn ghost" data-action="back-to-case-source">取消</button><span class="spacer"></span><button class="btn primary" data-action="generate-history-cases">${icon('spark',14)}生成 ${count} 条场景草稿</button></div></div>
        <aside class="editor-aside"><section class="card aside-card"><div class="aside-title">通话来源</div><div class="gate-line"><span>生产智能体</span><strong>${esc(source.name)}</strong></div><div class="gate-line"><span>生产版本</span><strong>${esc(source.version)}</strong></div><div class="gate-line"><span>已有通话</span><strong>${esc(source.calls)} 通</strong></div><div class="gate-line"><span>数据更新</span><strong>${esc(source.lastSync)}</strong></div><p class="page-sub" style="margin-top:10px">${esc(source.description)}</p></section></aside></div></div>`;
      }

      return `<div class="page editor-page"><div class="page-head"><div class="page-head-copy"><button class="btn ghost small" data-action="leave-editor">← ${f.originProblemId?'返回线上问题':'返回测试用例'}</button><h1 style="margin-top:9px">${f.originProblemId?'根据线上问题创建用例':`${editing?'编辑':'新建'}用例`}</h1><p class="page-sub">${f.originProblemId?'系统已经根据代表性通话预填客户场景和判断条件，请核对后保存。':'用一段完整提示词模拟客户，允许对话根据智能体回复自然分支；最终按业务结果和禁止事项判断。'}</p></div><div class="page-actions">${!editing&&!f.originProblemId?`<button class="btn small" data-action="fill-case-demo">填入示例</button>`:''}${badge(state.caseDirty?'有未保存修改':statusLabels[f.status],state.caseDirty?'review':'')}</div></div>
      <div class="editor-layout no-aside"><div class="editor-main"><section class="card editor-section"><div class="editor-section-head"><div class="editor-section-icon">${icon('spark',16)}</div><div class="editor-section-copy"><h2>完整的客户模拟提示词</h2><p>不拆成身份、目标、情绪等多个字段，直接用一段完整提示词定义模拟客户。</p></div></div><div class="editor-section-body"><div class="field full"><label>用例名称 *</label><input class="input" value="${esc(f.name)}" data-case-field="name" placeholder="例如：价格追问与加微信报价"><span class="hint">来源：${esc(f.source||'人工创建')}</span></div><div class="subsection"><div class="field"><label>客户与智能体交互提示词 *</label><textarea class="textarea" style="min-height:250px" data-case-field="interactionPrompt" placeholder="在一个完整提示词中说明：客户是谁、想完成什么、第一次会怎么说、会提供哪些信息、如何根据智能体回复继续交流，以及何时结束。">${esc(f.interactionPrompt)}</textarea><span class="hint">客户后续表达会根据智能体实际回复变化，不会照抄历史通话。</span></div><details style="margin-top:12px"><summary class="section-meta" style="cursor:pointer">运行设置</summary><div class="field" style="margin-top:10px;max-width:320px"><label>最多交流多少轮</label><input class="input" data-case-field="maxTurns" value="${esc(f.maxTurns||'10')}"></div></details></div></div></section>
      <section class="card editor-section"><div class="editor-section-head"><div class="editor-section-icon">${icon('check',16)}</div><div class="editor-section-copy"><h2>怎样算事情办成 *</h2><p>每行一条，结果页会逐条展示对话或系统操作证据。</p></div></div><div class="editor-section-body"><textarea class="textarea" style="min-height:120px" data-case-field="criteriaText" placeholder="每行一条事情办成的条件">${esc((f.criteria||[]).join('\n'))}</textarea></div></section>
      <section class="card editor-section"><div class="editor-section-head"><div class="editor-section-icon">${icon('issues',16)}</div><div class="editor-section-copy"><h2>哪些事情不能发生</h2><p>每行一条；出现任意一种，都需要在结果中明确标记。</p></div></div><div class="editor-section-body"><textarea class="textarea" data-case-field="avoidText" placeholder="例如：系统失败时不能声称已经办理成功">${esc((f.avoid||[]).join('\n'))}</textarea></div></section>
      <section class="card editor-section"><div class="editor-section-head"><div class="editor-section-icon">${icon('copy',16)}</div><div class="editor-section-copy"><h2>测试变量</h2><p>定义模拟客户可以使用的客户资料和业务字段。</p></div><button class="btn small" data-action="add-variable">${icon('plus',13)}添加变量</button></div><div class="editor-section-body">${f.variables.length?`<div class="data-table"><div class="data-head"><span>变量名称</span><span>内容类型</span><span>测试值</span><span>必须填写</span><span>隐藏敏感内容</span><span></span></div>${renderVariableRows()}</div>`:'<p class="page-sub">当前没有测试变量；需要时再添加。</p>'}</div></section>
      <section class="card editor-section"><div class="editor-section-head"><div class="editor-section-icon">${icon('settings',16)}</div><div class="editor-section-copy"><h2>模拟系统调用</h2><p>定义测试时调用哪些业务系统，以及返回成功、失败或超时。</p></div><button class="btn small" data-action="add-tool">${icon('plus',13)}添加模拟调用</button></div><div class="editor-section-body"><div class="tool-stack">${f.tools.map(renderToolCard).join('')||'<p class="page-sub">当前用例不涉及模拟系统调用。</p>'}</div></div></section>
      <div id="case-form-error"></div><div class="editor-savebar"><button class="btn ghost" data-action="leave-editor">取消</button><button class="btn" data-action="save-case-draft">保存草稿</button><span class="spacer"></span><button class="btn" data-action="try-case">${icon('runs',14)}先试一次</button><button class="btn primary" data-action="save-case">${editing&&f.status==='ready'?'保存修改':'保存并确认'}</button></div></div>
      </div></div>`;
    }

    function drawerShell(title,sub,body,foot='',wide=false) {
      return `<div class="overlay"><aside class="drawer ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="drawer-head"><div class="drawer-title"><h2>${esc(title)}</h2>${sub?`<p>${esc(sub)}</p>`:''}</div><button class="icon-btn drawer-close" data-action="close-overlay" aria-label="关闭">${icon('close',16)}</button></div><div class="drawer-body">${body}</div>${foot?`<div class="drawer-foot">${foot}</div>`:''}</aside></div>`;
    }

    function renderTranscript(result,version='draft') {
      if(!result) return '<p class="page-sub">这条用例还没有测试对话。</p>';
      const turns=version==='production'?(result.productionTranscript||[]):(result.draftTranscript||result.transcript||[]);
      return turns.length?`<div class="transcript">${turns.map(t=>`<div class="turn ${t.who==='agent'?'agent':''}"><div class="turn-avatar">${t.who==='agent'?'AI':'用户'}</div><div><div class="bubble">${esc(t.text)}</div><div class="turn-time">${t.time}</div></div></div>`).join('')}</div>`:'<p class="page-sub">当前没有对话记录。</p>';
    }

    function renderVersionEvidence(result,version,label) {
      const production=version==='production',outcome=production?(result.productionResult??result.baselineResult):effectiveResult(result),checks=production?(result.productionChecks||[]):(result.draftChecks||result.checks||[]);
      return `<section class="card card-pad"><div class="section-head"><div><div class="section-title">${esc(label)}</div><div class="section-meta">使用同一份用例预期独立判断</div></div>${badge(businessResult(outcome),resultTone(outcome))}</div><div style="margin-top:12px">${renderTranscript(result,version)}</div><div class="metric-label" style="margin-top:14px">逐项检查证据</div>${checks.map(check=>`<div class="review-item"><div class="review-item-top"><div class="review-item-title">${esc(check.text)}</div>${badge(check.status==='pass'?'处理正确':check.status==='fail'?'处理有问题':check.status==='error'?'未检查':'需要人工看',resultTone(check.status))}</div></div>`).join('')}</section>`;
    }

    function renderDiscoveryDrawer(id) {
      const c=getCandidate(id);if(!c) return '';
      const body=`<div class="split-detail"><div><div class="notice warn"><span>${icon('spark',17)}</span><div><strong>疑似性规则命中，不能直接判定对错</strong><p>规则只负责找出相关线上对话和证据；人工确认后才形成正式问题。</p></div></div><h3>系统看到的情况</h3><p class="page-sub">${esc(c.summary)}</p><div class="grid cols-3" style="margin:14px 0"><div class="card card-pad"><div class="metric-label">涉及对话</div><div class="metric-value" style="font-size:21px">${c.sessions}</div></div><div class="card card-pad"><div class="metric-label">近期对话占比</div><div class="metric-value" style="font-size:21px">${c.rate}</div></div><div class="card card-pad"><div class="metric-label">当前状态</div><div style="margin-top:7px">${badge(c.status,'review')}</div></div></div><h3>发现依据与代表性对话</h3><div class="card card-pad"><p>${esc(c.evidence)}</p><div class="gate-line"><span>影响数量</span><strong>${c.sessions} 通</strong></div><div class="gate-line"><span>发现方式</span><strong>${esc(c.ruleName||c.source||c.signal)} · ${esc(c.ruleVersion||'v1.0')}</strong></div></div><div class="card card-pad" style="margin-top:12px"><h3>为什么值得关注</h3><p class="page-sub">${esc(c.summary)}</p><h3>与现有线上检查规则有什么不同</h3><p class="page-sub">${esc(c.difference||'这是疑似性规则发现的异常现象，不能直接套用确定性失败结论。')}</p><h3>判断依据是否充分</h3><p class="page-sub">${esc(c.evidenceSufficiency||'需要人工结合代表对话判断。')}</p></div></div><aside class="review-panel"><div class="section-head"><div><div class="section-title">人工判断</div><div class="section-meta">${c.id} · ${esc(c.category)}</div></div>${badge(c.risk,riskTone(c.risk))}</div><div class="review-item"><div class="review-item-title">正常情况下应该怎样处理</div><div class="review-evidence">${esc(c.expected)}</div></div><div class="review-item"><label class="field"><span>判断依据 ${c.status==='待复核'?'*':''}</span><textarea class="textarea" data-review-field="discoveryReason" placeholder="说明为什么有问题、为什么可以接受，或为什么不是问题">${esc(state.reviewForm.discoveryReason||'')}</textarea></label></div>${c.problemId?`<div class="review-item"><div class="review-item-title">已形成后续记录</div><div class="inline-actions">${c.caseId?`<button class="btn small" data-action="open-test" data-id="${c.caseId}">查看测试用例</button>`:''}<button class="btn small" data-action="open-problem" data-id="${c.problemId}">查看后续处理</button></div></div>`:''}</aside></div>`;
      const foot=c.status==='待复核'?`<button class="btn" data-action="mark-acceptable" data-id="${c.id}">业务可以接受</button><button class="btn" data-action="snooze-candidate" data-id="${c.id}">证据不足，继续观察</button><button class="btn" data-action="mark-system-issue" data-id="${c.id}">系统或工具问题</button><span class="spacer"></span><button class="btn primary" data-action="confirm-bad" data-id="${c.id}">确认存在智能体问题</button>`:`${c.problemId?'':`<button class="btn" data-action="reopen-candidate" data-id="${c.id}">重新打开判断</button>`}<button class="btn" data-action="close-overlay">关闭</button>`;
      return drawerShell(c.title,`${c.id} · 首次发现于 ${c.firstSeen}`,body,foot,true);
    }

    function renderGeneratedDrawer(id) {
      const f=state.generatedForm,c=f?.candidateId?getCandidate(f.candidateId):null,p=f?.problemId?getProblem(f.problemId):null;if((!c&&!p)||!f) return '';
      const source=c||p;
      const body=`<div class="notice success" style="margin-bottom:16px"><span>${icon('check',17)}</span><div><strong>最后一步同时保存问题与场景用例</strong><p>${c?'点击保存前不会改变原候选状态；返回上一步也可以继续查看证据。':'将正式线上问题整理为可重复运行的客户场景，不复制历史客户的后续台词。'}</p></div></div><div class="form-grid"><div class="field full"><label>用例名称 *</label><input class="input" data-generated-field="name" value="${esc(f.name)}"></div><div class="field full"><label>客户与智能体交互提示词 *</label><textarea class="textarea" style="min-height:190px" data-generated-field="interactionPrompt">${esc(f.interactionPrompt||'')}</textarea><span class="hint">只描述客户场景和动态反应，不要求客户照着历史通话逐句说。</span></div><div class="field full"><label>怎样算处理正确 *（每行一条）</label><textarea class="textarea" style="min-height:120px" data-generated-field="criteriaText">${esc(f.criteriaText)}</textarea></div><div class="field full"><label>怎样算处理失败（每行一条）</label><textarea class="textarea" data-generated-field="avoidText">${esc(f.avoidText)}</textarea></div></div>`;
      const foot=`<button class="btn ghost" data-action="${c?'back-to-discovery':'open-problem'}" data-id="${source.id}">← 返回问题判断</button><span class="spacer"></span><button class="btn primary" data-action="${c?'save-generated':'save-problem-case'}" data-id="${source.id}">保存问题和测试用例</button>`;

    function chainStrip(p,isSystem) {
      const cand=getCandidate(p.source),srcRun=currentRuns().find(r=>r.id===p.source);
      const nodes=isSystem?[
        ['线上候选',cand?cand.id:'待完成',cand?'open-discovery':''],
        ['系统修复',p.status==='已关闭'?'已确认':'处理中',''],
        ['关闭',p.closedAt||'待完成','']
      ]:[
        ['线上候选',cand?cand.id:(srcRun?srcRun.id:''),cand?'open-discovery':(srcRun?'open-report':'')],
        ['回归用例',p.caseId||'待完成',p.caseId?'open-test':''],
        ['单条复测',p.singleRunId||'待完成',p.singleRunId?'open-report':''],
        ['全量回归',p.fullRunId||'待完成',p.fullRunId?'open-report':''],
        ['上线版本',p.deployVersion||'待完成',''],
        ['线上验证',p.closedAt||'待完成','']
      ];
      return `<div class="chain-title">闭环链路</div><div class="chain-strip">${nodes.map(([label,value,action])=>{
        const done=Boolean(value)&&value!=='待完成';
        const cls=`chain-node ${done?'done':'pending'}`;
        const inner=`<span class="cn-label">${label}</span><span class="cn-value">${esc(String(value))}</span>`;
        return (action&&done)?`<button class="${cls}" data-action="${action}" data-id="${esc(String(value))}">${inner}</button>`:`<div class="${cls}">${inner}</div>`;
      }).join('')}</div>`;
    }

    function renderProblemDrawer(id) {

)?'草稿验证通过不等于生产恢复':'先完成修改，再依次进行单条复测和重点回归'}</strong><p>${isSystem?'不生成智能体测试用例，不影响智能体评测结果；只保留系统修复证据。':p.status==='已关闭'?'保留修改、复测和线上观察证据；复发时可重新打开。':['待上线','待线上验证'].includes(p.status)?'需要模拟上线并观察同类生产问题，之后才能关闭。':'复测会生成新的测试任务和结果，不改写历史报告。'}</p></div></div>`;
      let actions='';
      if(isSystem&&p.status!=='已关闭') actions=`<button class="btn primary" data-action="close-system-problem" data-id="${p.id}">模拟系统修复并关闭</button>`;
      if(!isSystem&&!['已关闭','待上线','待线上验证'].includes(p.status)) actions=`<button class="btn" data-action="retest-one" data-id="${p.id}">单条复测</button><button class="btn primary" data-action="full-regression" data-id="${p.id}">回归全部已确认用例</button>`;
      if(p.status==='待上线') actions=`<button class="btn primary" data-action="deploy-problem" data-id="${p.id}">模拟上线并开始观察</button>`;
      if(p.status==='待线上验证') actions=`<button class="btn" data-action="reopen-problem" data-id="${p.id}">发现复发，重新打开</button><button class="btn primary" data-action="close-problem" data-id="${p.id}">线上验证通过并关闭</button>`;
      if(p.status==='已关闭') actions=`<button class="btn" data-action="reopen-problem" data-id="${p.id}">发现复发，重新打开</button>`;
      return drawerShell(p.title,`${p.id} · ${p.status}`,body,`<span class="spacer"></span>${actions}`);
    }

    function runScopeCount(scope) {
      if(scope==='selected') return eligibleTests().filter(c=>state.selectedTests.has(c.id)).length;
      if(scope==='set') {
        const set=currentSets().find(item=>item.id===state.runForm.setId);
        return set?(set.caseIds||[]).map(getCase).filter(test=>test?.status==='ready').length:0;
      }
      return eligibleTests().length;
    }




    function renderRunModal() {
      const agent=currentAgent(),scope=state.runForm.scope,total=runScopeCount(scope);
      const selectedCases=casesForScope(scope);
      const sandbox=selectedCases.some(c=>(c.tools||[]).some(t=>t.mode==='sandbox'));
      const set=scope==='set'?currentSets().find(item=>item.id===state.runForm.setId):null;
      const choices=scope==='set'?[['set',set?.name||'当前评测集','只运行这个评测集中当前已确认的用例',runScopeCount('set')]]:[['selected','当前选中的用例','只测试列表中已勾选且已确认的用例',runScopeCount('selected')],['all','全部可测试用例','不包括草稿和待确认用例',runScopeCount('all')]];

    }

      }
      if(action==='analyze'){
        if(state.analysisRunning)return;state.analysisRunning=true;render();setTimeout(()=>{state.analysisRunning=false;showToast('线上检查已完成',`已按 ${currentDB().rules.length} 条规则检查 126 通真实会话，没有新增命中；确定性命中会直接形成问题，疑似性命中进入等待确认。`);},1200);return;
      }
    });

    document.addEventListener('input',event=>{
      const el=event.target,value=el.type==='checkbox'?el.checked:el.value;
      if(el.dataset.agentCaseSearch!==undefined){
        const pos=el.selectionStart||0;
        state.agentCaseQuery=value;
        if(event.isComposing)return;
        render();
        const box=document.querySelector('[data-agent-case-search]');
        if(box){box.focus();try{box.setSelectionRange(pos,pos);}catch(err){}}
        return;
      }
      if(el.dataset.setSearch!==undefined){
        const pos=el.selectionStart||0;
        state.setCaseQuery=value;
        if(event.isComposing)return;
        render();
        const box=document.querySelector('[data-set-search]');
        if(box){box.focus();try{box.setSelectionRange(pos,pos);}catch(err){}}
        return;
      }
      const caseField=el.dataset.caseField;
      if(caseField&&state.caseForm){
        if(caseField==='criteriaText')state.caseForm.criteria=value.split('\n').map(x=>x.trim()).filter(Boolean);
        else if(caseField==='avoidText')state.caseForm.avoid=value.split('\n').map(x=>x.trim()).filter(Boolean);
        else state.caseForm[caseField]=value;
        if(caseField==='otherAgentId'){state.caseForm.otherAgentCaseIds=[];state.caseForm.otherAgentSetId='';state.agentCaseQuery='';}
        state.caseDirty=true;
        if(caseField==='otherAgentSetId'){
          const src=tenantAgentCaseSources.find(agent=>agent.id===state.caseForm.otherAgentId)||tenantAgentCaseSources[0];
          const set=(src.sets||[]).find(item=>item.id===value);
          state.caseForm.otherAgentCaseIds=set?set.caseIndexes.map(index=>src.id+'-'+index):[];
          render();return;
        }
        if(['sourceAgentId','historyCount','otherAgentId','aiCount'].includes(caseField)){render();return;}
      }
      const variableField=el.dataset.variableField;
      if(variableField&&state.caseForm){const variable=state.caseForm.variables.find(v=>v.id===el.dataset.id);if(variable)variable[variableField]=value;state.caseDirty=true;}
      const toolField=el.dataset.toolField;
      if(toolField&&state.caseForm){const tool=state.caseForm.tools.find(t=>t.id===el.dataset.id);if(tool)tool[toolField]=value;state.caseDirty=true;}
      const generatedField=el.dataset.generatedField;
      if(generatedField&&state.generatedForm){state.generatedForm[generatedField]=value;state.generatedDirty=true;if(generatedField==='type'){render();return;}}
      const setField=el.dataset.setField;
      if(setField&&state.setForm)state.setForm[setField]=value;
      const reviewField=el.dataset.reviewField;
      if(reviewField)state.reviewForm[reviewField]=value;
      const problemField=el.dataset.problemField;
      if(problemField)state.problemForm[problemField]=value;
      const ruleField=el.dataset.ruleField;
      if(ruleField&&state.ruleForm)state.ruleForm[ruleField]=value;
      const runField=el.dataset.runField;
      if(runField){state.runForm[runField]=value;if(el.type==='checkbox'){render();return;}}
      const discoverySetting=el.dataset.discoverySetting;
      if(discoverySetting)currentDB().discoverySettings[discoverySetting]=discoverySetting==='minSessions'?Math.max(1,Number(value)||1):value;
    });

    document.addEventListener('change',event=>{
      const input=event.target;
      if(!input.matches('[data-case-import-file]')||!state.caseForm)return;
      const file=input.files?.[0];if(!file)return;
      const reader=new FileReader();
      reader.onload=()=>{
        try {
          const imported=normalizeImportedCases(JSON.parse(String(reader.result||'')));
          if(!imported.length)throw new Error('没有识别到有效用例，请检查 cases 数组、用例名称和客户模拟提示词。');
          state.caseForm.importCases=imported;state.caseForm.importFileName=file.name;state.caseForm.importError='';render();
        } catch(error) {
          state.caseForm.importCases=[];state.caseForm.importFileName=file.name;state.caseForm.importError=error?.message||'文件不是有效的 JSON 格式。';render();
        }
      };
      reader.onerror=()=>{state.caseForm.importCases=[];state.caseForm.importFileName=file.name;state.caseForm.importError='文件读取失败，请重新选择。';render();};
      reader.readAsText(file,'utf-8');
    });

    document.addEventListener('keydown',event=>{
      const tag=document.activeElement?.tagName,editing=['INPUT','TEXTAREA','SELECT'].includes(tag)||document.activeElement?.isContentEditable;
      if(event.key==='Enter'&&tag==='TR'&&document.activeElement.dataset.action){event.preventDefault();document.activeElement.click();return;}
      if(event.key==='Escape'&&state.overlay&&!editing){
        if(state.overlay.type==='run-progress'){showToast('测试仍在进行','请等待完成，或先取消任务。','warn');return;}
        if(state.overlay.type==='generated'&&state.generatedDirty&&!window.confirm('用例内容尚未保存，确定放弃这些修改吗？'))return;
        state.overlay=null;state.generatedForm=null;state.generatedDirty=false;render();
      }
    });

    render();
  })();
  </script>
</body>
</html>
