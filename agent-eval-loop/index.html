<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>智能体测试与线上问题 · 交互原型 V0.10</title>
  <!--
    PROTOTYPE — 单智能体测试与线上问题工作区 V0.10。
    本版验证三个问题：只保留多轮客户场景；线上候选按四种人工结论分类筛选；确认智能体问题后直接进入整页创建用例。
    所有状态只保存在当前页面内存，不连接真实生产数据。
  -->
  <style>
    :root {
      --ink: #17191f;
      --ink-2: #353945;
      --muted: #737987;
      --muted-2: #9ba1ad;
      --line: #e7e9ef;
      --line-strong: #d8dbe5;
      --canvas: #f6f7f9;
      --surface: #ffffff;
      --surface-2: #fafbfc;
      --accent: #6558e8;
      --accent-2: #5145cd;
      --accent-soft: #f0eefe;
      --mint: #14866d;
      --mint-soft: #e8f7f2;
      --amber: #a96b11;
      --amber-soft: #fff5df;
      --red: #c63d4e;
      --red-soft: #fff0f2;
      --blue: #3273dc;
      --blue-soft: #edf4ff;
      --shadow: 0 14px 38px rgba(24, 27, 39, .08);
      --shadow-sm: 0 4px 14px rgba(24, 27, 39, .06);
      --r-sm: 8px;
      --r-md: 12px;
      --r-lg: 18px;
      --sidebar: 236px;
      --font-body: "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
      --font-data: "Bahnschrift", "Segoe UI", "Microsoft YaHei UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html { height: 100%; background: var(--canvas); }
    body {
      margin: 0;
      min-height: 100%;
      background: var(--canvas);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
      outline: 3px solid rgba(101, 88, 232, .22);
      outline-offset: 2px;
    }
    a { color: inherit; text-decoration: none; }
    svg { display: block; }

    .prototype-note {
      position: fixed;
      z-index: 70;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      padding: 5px 10px;
      border: 1px solid rgba(101, 88, 232, .2);
      border-radius: 999px;
      background: rgba(255,255,255,.9);
      color: var(--accent-2);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: .02em;
      backdrop-filter: blur(10px);
      pointer-events: none;
    }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0, 1fr);
    }

    .sidebar {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 22px 14px 16px;
      border-right: 1px solid var(--line);
      background: rgba(255,255,255,.96);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px 18px;
      font-weight: 720;
      letter-spacing: -.02em;
    }
    .brand-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: var(--ink);
      color: white;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.1);
    }
    .brand-mark span {
      width: 12px;
      height: 12px;
      border: 2px solid white;
      border-radius: 50%;
      position: relative;
    }
    .brand-mark span::after {
      content: "";
      position: absolute;
      width: 4px;
      height: 4px;
      top: 2px;
      left: 2px;
      border-radius: 50%;
      background: #b8afff;
    }
    .brand-sub { display: block; color: var(--muted); font-size: 10px; font-weight: 500; letter-spacing: 0; }
    .agent-switcher { position: relative; margin-bottom: 18px; }
    .agent-card {
      width: 100%;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      background: var(--surface-2);
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }
    .agent-card:hover { border-color: #cfd2dd; background: #f4f5f8; }
    .agent-card-top { display: flex; gap: 9px; align-items: center; }
    .agent-avatar {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 50%;
      background: linear-gradient(135deg, #efeefe, #d8f6ee);
      color: var(--accent-2);
      font-weight: 750;
      font-family: var(--font-data);
    }
    .agent-name { min-width: 0; font-size: 13px; font-weight: 680; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .agent-meta { color: var(--muted); font-size: 11px; }
    .live-dot { display: inline-block; width: 6px; height: 6px; margin-right: 4px; border-radius: 50%; background: #24a47e; }
    .live-dot.draft { background: #f0a12a; }
    .agent-menu {
      position: absolute;
      z-index: 90;
      top: calc(100% + 7px);
      left: 0;
      width: 286px;
      padding: 7px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: white;
      box-shadow: 0 18px 44px rgba(30,34,47,.16);
    }
    .agent-menu-title { padding: 7px 9px 6px; color: var(--muted); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; }
    .agent-option {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }
    .agent-option:hover, .agent-option.active { background: var(--accent-soft); }
    .agent-option-copy { min-width: 0; flex: 1; }
    .agent-option-copy strong { display: block; overflow: hidden; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .agent-option-copy span { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; }
    .agent-status { padding: 3px 6px; border-radius: 999px; background: var(--mint-soft); color: var(--mint); font-size: 9px; white-space: nowrap; }
    .agent-status.draft { background: var(--amber-soft); color: var(--amber); }
    .nav-label { margin: 4px 10px 7px; color: var(--muted-2); font-size: 10px; font-weight: 680; text-transform: uppercase; letter-spacing: .08em; }
    .nav-list { display: grid; gap: 3px; }
    .nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--ink-2);
      text-align: left;
      cursor: pointer;
      transition: background .16s ease, color .16s ease;
    }
    .nav-item:hover { background: #f2f3f7; }
    .nav-item.active { background: var(--accent-soft); color: var(--accent-2); font-weight: 650; }
    .nav-icon { width: 18px; height: 18px; flex: 0 0 auto; }
    .nav-count {
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      display: inline-grid;
      place-items: center;
      margin-left: auto;
      border-radius: 999px;
      background: #f0f1f4;
      color: var(--muted);
      font: 600 11px/1 var(--font-data);
    }
    .nav-item.active .nav-count { background: white; color: var(--accent-2); }
    .sidebar-foot { margin-top: auto; }
    .sidebar-help {
      padding: 12px;
      border-radius: var(--r-md);
      background: #f7f7fb;
      color: var(--muted);
      font-size: 11px;
    }
    .sidebar-help strong { display: block; margin-bottom: 4px; color: var(--ink-2); font-size: 12px; }

    .context-panel { display: none; }
    .main { min-width: 0; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 15;
      height: 64px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 28px;
      border-bottom: 1px solid var(--line);
      background: rgba(246,247,249,.88);
      backdrop-filter: blur(14px);
    }
    .breadcrumbs { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .breadcrumbs .current { color: var(--ink); font-weight: 620; }
    .top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .search {
      width: 210px;
      height: 34px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: white;
      color: var(--muted);
      font-size: 12px;
    }
    .keyboard { margin-left: auto; color: var(--muted-2); font-size: 10px; }
    .icon-btn {
      width: 34px;
      height: 34px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: white;
      cursor: pointer;
    }
    .user-avatar { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; background: #e9e5ff; color: var(--accent-2); font-weight: 700; font-size: 12px; }
    .page { padding: 28px 30px 96px; max-width: 1500px; margin: 0 auto; }
    .page-head { display: flex; align-items: flex-start; gap: 18px; margin-bottom: 22px; }
    .page-head-copy { min-width: 0; }
    .eyebrow { color: var(--accent-2); font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { margin-bottom: 5px; font-size: 25px; line-height: 1.25; letter-spacing: -.035em; }
    h2 { margin-bottom: 8px; font-size: 17px; line-height: 1.3; letter-spacing: -.02em; }
    h3 { margin-bottom: 6px; font-size: 14px; line-height: 1.4; }
    .page-sub { margin: 0; color: var(--muted); font-size: 13px; }
    .page-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .btn {
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 13px;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      background: white;
      color: var(--ink-2);
      font-weight: 620;
      font-size: 12px;
      cursor: pointer;
      transition: transform .14s ease, box-shadow .14s ease, background .14s ease;
    }
    .btn:hover { box-shadow: var(--shadow-sm); transform: translateY(-1px); }
    .btn.primary { border-color: var(--accent); background: var(--accent); color: white; }
    .btn.primary:hover { background: var(--accent-2); }
    .btn.soft { border-color: transparent; background: var(--accent-soft); color: var(--accent-2); }
    .btn.danger { border-color: #efc5ca; background: var(--red-soft); color: var(--red); }
    .btn.ghost { border-color: transparent; background: transparent; }
    .btn.small { height: 30px; padding: 0 10px; font-size: 11px; }
    .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }

    .grid { display: grid; gap: 14px; }
    .grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .span-2 { grid-column: span 2; }
    .card {
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      background: var(--surface);
      box-shadow: 0 1px 0 rgba(0,0,0,.015);
    }
    .card-pad { padding: 17px; }
    .metric { min-height: 116px; padding: 16px; }
    .metric-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .metric-label { color: var(--muted); font-size: 11px; font-weight: 610; }
    .metric-value { margin-top: 11px; font: 680 27px/1 var(--font-data); letter-spacing: -.025em; }
    .metric-foot { display: flex; gap: 6px; align-items: center; margin-top: 9px; color: var(--muted); font-size: 11px; }
    .delta-up { color: var(--mint); font-weight: 650; }
    .delta-down { color: var(--red); font-weight: 650; }
    .metric-icon { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 8px; background: var(--surface-2); color: var(--muted); }

    .quality-loop {
      position: relative;
      overflow: hidden;
      padding: 20px;
      border-color: #dedaf9;
      background: linear-gradient(120deg, #fcfbff 0%, #ffffff 58%, #f5fbf9 100%);
    }
    .quality-loop::after {
      content: "";
      position: absolute;
      width: 240px;
      height: 240px;
      right: -120px;
      top: -150px;
      border: 38px solid rgba(101,88,232,.05);
      border-radius: 50%;
      pointer-events: none;
    }
    .loop-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 20px; }
    .loop-title { max-width: 560px; }
    .loop-title p { margin: 0; color: var(--muted); font-size: 12px; }
    .loop-status { margin-left: auto; display: flex; align-items: center; gap: 7px; color: var(--mint); font-size: 11px; font-weight: 650; }
    .pulse { width: 7px; height: 7px; border-radius: 50%; background: #20a783; box-shadow: 0 0 0 5px rgba(32,167,131,.12); }
    .loop-track { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .loop-stage { position: relative; min-height: 80px; padding: 12px; border: 1px solid rgba(101,88,232,.12); border-radius: 11px; background: rgba(255,255,255,.8); }
    .loop-stage:not(:last-child)::after { content: "→"; position: absolute; right: -10px; top: 27px; z-index: 2; color: #b2abc9; font-weight: 700; }
    .stage-kicker { color: var(--muted-2); font: 650 10px/1 var(--font-data); letter-spacing: .08em; }
    .stage-main { display: flex; align-items: baseline; gap: 7px; margin-top: 9px; }
    .stage-count { font: 700 22px/1 var(--font-data); }
    .stage-unit { color: var(--muted); font-size: 11px; }
    .stage-note { margin-top: 8px; color: var(--muted); font-size: 10px; }

    .section-head { display: flex; align-items: center; gap: 12px; padding: 16px 17px 12px; }
    .section-title { font-weight: 680; }
    .section-meta { color: var(--muted); font-size: 11px; }
    .section-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }
    .divider { height: 1px; background: var(--line); }
    .mini-chart { height: 190px; padding: 10px 16px 16px; }
    .chart-legend { display: flex; gap: 16px; align-items: center; color: var(--muted); font-size: 10px; }
    .legend-dot { display: inline-block; width: 7px; height: 7px; margin-right: 5px; border-radius: 50%; }
    .chart-wrap { height: 145px; margin-top: 8px; }
    .chart-wrap svg { width: 100%; height: 100%; overflow: visible; }

    .issue-list { padding: 2px 8px 8px; }
    .issue-row {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      padding: 12px 10px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .issue-row:last-child { border-bottom: 0; }
    .issue-row:hover { border-radius: 9px; background: var(--surface-2); }
    .issue-title { font-size: 12px; font-weight: 640; }
    .issue-meta { display: flex; gap: 7px; align-items: center; margin-top: 4px; color: var(--muted); font-size: 10px; }
    .issue-count { text-align: right; }
    .issue-count strong { display: block; font: 680 16px/1 var(--font-data); }
    .issue-count span { color: var(--muted); font-size: 9px; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 21px;
      padding: 2px 7px;
      border-radius: 999px;
      background: #f0f1f4;
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
      white-space: nowrap;
    }
    .badge.pass, .badge.success { background: var(--mint-soft); color: var(--mint); }
    .badge.fail, .badge.block { background: var(--red-soft); color: var(--red); }
    .badge.review, .badge.warn { background: var(--amber-soft); color: var(--amber); }
    .badge.info { background: var(--blue-soft); color: var(--blue); }
    .badge.accent { background: var(--accent-soft); color: var(--accent-2); }
    .badge .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .tabs { display: flex; align-items: center; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: white; }
    .tab { min-height: 29px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font-size: 11px; font-weight: 620; cursor: pointer; }
    .tab.active { background: #f1f2f5; color: var(--ink); }
    .sub-toolbar { margin-top: -6px; margin-bottom: 12px; padding-left: 2px; }
    .tabs.sub { border: 0; background: transparent; padding: 0; gap: 6px; }
    .tabs.sub .tab { min-height: 26px; padding: 0 9px; border: 1px solid var(--line); background: white; border-radius: 999px; font-size: 11px; font-weight: 600; color: var(--muted); }
    .tabs.sub .tab:hover { color: var(--ink); }
    .tabs.sub .tab.active { background: var(--ink); border-color: var(--ink); color: #fff; }
    .asset-tabs { display:flex; align-items:center; gap:22px; margin:-4px 0 16px; border-bottom:1px solid var(--line); }
    .asset-tab { position:relative; min-height:42px; padding:0 2px; border:0; background:transparent; color:var(--muted); font-size:13px; font-weight:650; cursor:pointer; }
    .asset-tab:hover { color:var(--ink); }
    .asset-tab.active { color:var(--accent); }
    .asset-tab.active::after { content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px; border-radius:2px; background:var(--accent); }
    .set-summary { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
    .set-summary strong { font-size:21px; letter-spacing:-.03em; }
    .set-case-list { display:grid; gap:8px; }
    .set-case-row { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:12px; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:#fff; }
    .set-case-row .cell-sub { margin-top:3px; }
    .set-table .col-set-ops { width:150px; }
    .set-table td.col-set-ops { vertical-align:middle; }
    .set-table .row-actions { flex-wrap:nowrap; }
    .row-actions .btn { white-space:nowrap; }
    .filter-btn { height: 34px; display: flex; align-items: center; gap: 6px; padding: 0 10px; border: 1px solid var(--line); border-radius: 9px; background: white; color: var(--muted); font-size: 11px; cursor: pointer; }
    .toolbar-spacer { flex: 1; }
    .table-card { overflow: hidden; }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; background: white; }
    th { height: 42px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--surface-2); color: var(--muted); font-size: 10px; font-weight: 650; text-align: left; white-space: nowrap; }
    td { height: 54px; padding: 8px 14px; border-bottom: 1px solid var(--line); color: var(--ink-2); font-size: 11px; vertical-align: middle; }
    tr:last-child td { border-bottom: 0; }
    tbody tr { cursor: pointer; }
    tbody tr:hover td { background: #fcfcfd; }
    .cell-main { color: var(--ink); font-size: 12px; font-weight: 630; }
    .cell-sub { margin-top: 2px; color: var(--muted); font-size: 10px; }
    .case-table { table-layout: fixed; }
    .case-table .col-check { width: 40px; }
    .case-table .col-name { width: 21%; }
    .case-table .col-time { width: 92px; }
    .case-table .col-ops { width: 216px; }
    .case-table td { vertical-align: top; padding-top: 12px; padding-bottom: 12px; height: auto; }
    .case-table td.col-check, .case-table td.col-time, .case-table td.col-ops { vertical-align: middle; }
    .cell-clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; color: var(--ink-2); font-size: 11px; line-height: 1.65; word-break: break-word; }
    .row-actions { display: flex; gap: 4px; flex-wrap: nowrap; }
    .row-actions .btn { padding: 0 7px; gap: 4px; }
    .row-actions .btn.danger { color: var(--red); }
    .row-actions .btn:disabled { opacity: .38; cursor: not-allowed; }
    .check { width: 15px; height: 15px; accent-color: var(--accent); }
    .kebab { width: 28px; height: 28px; display: grid; place-items: center; border: 0; border-radius: 7px; background: transparent; color: var(--muted); cursor: pointer; }
    .kebab:hover { background: #f1f2f4; }

    .notice { display: flex; align-items: flex-start; gap: 10px; padding: 12px 13px; border: 1px solid #dedaf9; border-radius: 10px; background: #f8f7ff; color: var(--ink-2); font-size: 11px; }
    .notice strong { display: block; margin-bottom: 2px; }
    .notice p { margin: 0; color: var(--muted); }
    .notice.warn { border-color: #f0d7aa; background: #fffaf0; }
    .notice.success { border-color: #c6e9df; background: #f2fbf8; }

    .empty { display: grid; place-items: center; min-height: 260px; padding: 30px; text-align: center; }
    .empty-icon { width: 46px; height: 46px; display: grid; place-items: center; margin-bottom: 12px; border-radius: 14px; background: var(--accent-soft); color: var(--accent-2); }
    .empty p { max-width: 360px; margin: 0 0 14px; color: var(--muted); font-size: 12px; }

    .verdict-bar { position: relative; display: flex; align-items: center; gap: 13px; padding: 15px 18px 15px 21px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--surface); overflow: hidden; }
    .verdict-bar::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--muted-2); }
    .verdict-bar.fail::before { background: var(--red); }

    .verdict-icon { flex: none; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 11px; background: var(--surface-2); color: var(--muted); }
    .verdict-bar.fail .verdict-icon { background: var(--red-soft); color: var(--red); }
    .verdict-bar.review .verdict-icon { background: var(--amber-soft); color: var(--amber); }
    .verdict-bar.pass .verdict-icon { background: var(--mint-soft); color: var(--mint); }
    .verdict-copy { min-width: 0; }
    .verdict-title { font-size: 16px; font-weight: 700; letter-spacing: -.02em; }
    .verdict-hint { max-width: 620px; margin-top: 4px; color: var(--muted); font-size: 11px; line-height: 1.55; }
    .verdict-metrics { display: flex; align-items: center; margin-left: auto; padding: 8px 3px; border-radius: 11px; background: #f4f5f8; }
    .vm { min-width: 86px; padding: 0 14px; margin-left: 0; border-left: 1px solid #e2e5ec; }
    .vm:first-child { border-left: 0; }
    .vm span { display: block; color: var(--muted); font-size: 10px; }
    .vm strong { display: block; margin-top: 4px; font: 700 20px/1 var(--font-data); color: var(--muted-2); }
    .vm.pass strong { color: var(--mint); }
    .vm.fail strong { color: var(--red); }
    .vm.review strong { color: var(--amber); }
    .gate-line { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 11px; }
    .gate-line:last-child { border-bottom: 0; }

    .progress { height: 7px; overflow: hidden; border-radius: 999px; background: #eceef2; }
    .progress > span { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width .4s ease; }
    .progress.red > span { background: var(--red); }
    .progress.mint > span { background: var(--mint); }
    .category-row { display: grid; grid-template-columns: minmax(120px, .8fr) minmax(180px, 1.6fr) 80px 80px; gap: 12px; align-items: center; padding: 12px 17px; border-top: 1px solid var(--line); font-size: 11px; }
    .category-name { font-weight: 620; }

    .overlay { position: fixed; z-index: 80; inset: 0; display: flex; justify-content: flex-end; background: rgba(22,24,31,.26); backdrop-filter: blur(2px); }
    .drawer { width: min(720px, 94vw); height: 100%; display: flex; flex-direction: column; background: white; box-shadow: -20px 0 50px rgba(22,24,31,.12); animation: slideIn .2s ease-out; }
    .drawer.wide { width: min(1040px, 96vw); }
    .drawer-head { min-height: 65px; display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
    .drawer-title { min-width: 0; }
    .drawer-title h2 { margin: 0; font-size: 16px; }
    .drawer-title p { margin: 2px 0 0; color: var(--muted); font-size: 10px; }
    .drawer-close { margin-left: auto; }
    .drawer-body { flex: 1; overflow: auto; padding: 20px; }
    .drawer-foot { display: flex; align-items: center; gap: 8px; padding: 13px 20px; border-top: 1px solid var(--line); background: var(--surface-2); }
    .drawer-foot .spacer { flex: 1; }
    .modal-wrap { width: 100%; display: grid; place-items: center; padding: 18px; }
    .modal { width: min(720px, 96vw); max-height: 92vh; display: flex; flex-direction: column; overflow: hidden; border-radius: 16px; background: white; box-shadow: var(--shadow); animation: popIn .18s ease-out; }
    .modal .drawer-body { padding: 22px; }

    .steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 0 20px 16px; border-bottom: 1px solid var(--line); }
    .step { position: relative; display: flex; align-items: center; gap: 7px; color: var(--muted-2); font-size: 10px; }
    .step::after { content: ""; position: absolute; left: 24px; right: 5px; top: 10px; height: 1px; background: var(--line); }
    .step:last-child::after { display: none; }
    .step-num { position: relative; z-index: 1; width: 20px; height: 20px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 50%; background: white; font: 650 9px/1 var(--font-data); }
    .step.active { color: var(--accent-2); font-weight: 650; }
    .step.active .step-num, .step.done .step-num { border-color: var(--accent); background: var(--accent); color: white; }
    .step.done::after { background: var(--accent); }
    .step-label { position: relative; z-index: 1; background: white; padding-right: 5px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .field { display: grid; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: var(--ink-2); font-size: 11px; font-weight: 620; }
    .field .hint { color: var(--muted); font-size: 10px; }
    .input, .select, .textarea {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 9px;
      background: white;
      color: var(--ink);
    }
    .input, .select { height: 38px; padding: 0 10px; }
    .textarea { min-height: 86px; padding: 10px; resize: vertical; }
    .choice-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .choice {
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: white;
      cursor: pointer;
    }
    .choice:hover, .choice.selected { border-color: #aaa1f0; box-shadow: 0 0 0 3px var(--accent-soft); }
    .choice-icon { width: 32px; height: 32px; display: grid; place-items: center; margin-bottom: 10px; border-radius: 9px; background: var(--accent-soft); color: var(--accent-2); }
    .choice strong { display: block; margin-bottom: 3px; }
    .choice p { margin: 0; color: var(--muted); font-size: 10px; }
    .criterion { display: grid; grid-template-columns: 22px 1fr auto; gap: 9px; align-items: start; padding: 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); }
    .criterion + .criterion { margin-top: 7px; }
    .criterion-index { width: 20px; height: 20px; display: grid; place-items: center; border-radius: 6px; background: white; color: var(--muted); font-size: 9px; font-weight: 650; }
    .criterion-main { font-size: 11px; }
    .criterion-main span { display: block; margin-top: 2px; color: var(--muted); font-size: 9px; }

    .editor-page { max-width: 1320px; }
    .editor-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
    .editor-layout.no-aside { grid-template-columns: minmax(0,1fr); }
    .editor-main { display: grid; gap: 14px; min-width: 0; }
    .editor-section { overflow: hidden; }
    .editor-section-head { display: flex; align-items: flex-start; gap: 12px; padding: 19px 20px 14px; }
    .editor-section-icon { width: 32px; height: 32px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 9px; background: var(--accent-soft); color: var(--accent-2); }
    .editor-section-copy { min-width: 0; }
    .editor-section-copy h2 { margin: 0 0 3px; font-size: 15px; }
    .editor-section-copy p { margin: 0; color: var(--muted); font-size: 10px; }
    .editor-section-action { margin-left: auto; }
    .editor-section-body { padding: 2px 20px 20px; }
    .method-choice { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 9px; margin-top: 14px; }
    .creation-source-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
    .method-card { display: grid; grid-template-columns: 32px 1fr auto; gap: 10px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: white; text-align: left; cursor: pointer; }
    .method-card:hover, .method-card.selected { border-color: #aaa1f0; background: #fbfaff; box-shadow: 0 0 0 3px var(--accent-soft); }
    .method-card-icon { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; background: var(--surface-2); color: var(--muted); }
    .method-card.selected .method-card-icon { background: var(--accent-soft); color: var(--accent-2); }
    .method-card strong { display: block; font-size: 11px; }
    .method-card small { display: block; margin-top: 2px; color: var(--muted); font-size: 9px; }
    .radio-mark { width: 17px; height: 17px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-radius: 50%; background: white; }
    .method-card.selected .radio-mark { border: 5px solid var(--accent); }
    .subsection { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
    .subsection-title { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 11px; font-weight: 680; }
    .helper-chip { display: inline-flex; align-items: center; min-height: 26px; padding: 0 9px; border: 1px solid var(--line); border-radius: 999px; background: white; color: var(--muted); font-size: 9px; cursor: pointer; }
    .helper-chip:hover { border-color: #b9b2ed; color: var(--accent-2); }
    .helper-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

    .data-table { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .data-head, .data-row { display: grid; grid-template-columns: minmax(120px,1fr) 95px minmax(150px,1.25fr) 60px 60px 34px; gap: 8px; align-items: center; }
    .data-head { min-height: 35px; padding: 0 10px; background: var(--surface-2); color: var(--muted); font-size: 9px; font-weight: 650; }
    .data-row { padding: 9px 10px; border-top: 1px solid var(--line); }
    .data-row .input, .data-row .select { height: 34px; font-size: 10px; }
    .tiny-check { display: grid; place-items: center; gap: 2px; color: var(--muted); font-size: 8px; }
    .variable-preview { display: inline-flex; align-items: center; padding: 2px 6px; border-radius: 5px; background: #f1f2f5; color: var(--ink-2); font: 9px/1.5 ui-monospace, "Cascadia Mono", monospace; }

    .tool-stack { display: grid; gap: 10px; }
    .tool-card { border: 1px solid var(--line); border-radius: 11px; overflow: hidden; background: white; }
    .tool-card-head { display: flex; align-items: center; gap: 10px; padding: 12px 13px; background: var(--surface-2); }
    .tool-symbol { width: 30px; height: 30px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 8px; background: white; color: var(--accent-2); box-shadow: inset 0 0 0 1px var(--line); }
    .tool-name { font-size: 11px; font-weight: 680; }
    .tool-id { color: var(--muted); font: 9px/1.4 ui-monospace, "Cascadia Mono", monospace; }
    .tool-mode { margin-left: auto; display: flex; align-items: center; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 8px; background: white; }
    .mode-btn { min-height: 27px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 9px; font-weight: 620; cursor: pointer; }
    .mode-btn.active { background: var(--accent-soft); color: var(--accent-2); }
    .mode-btn.blocked.active { background: var(--red-soft); color: var(--red); }
    .tool-card-body { padding: 13px; }
    .code-input { font: 10px/1.55 ui-monospace, "Cascadia Mono", "Microsoft YaHei UI", monospace; tab-size: 2; }
    .assertion-strip { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 11px; padding-top: 11px; border-top: 1px solid var(--line); }
    .assertion-pill { display: flex; align-items: center; gap: 6px; min-height: 29px; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink-2); font-size: 9px; }
    .mock-state { padding: 13px; color: var(--muted); font-size: 10px; }

    .editor-aside { position: sticky; top: 82px; display: grid; gap: 12px; }
    .aside-card { padding: 16px; }
    .aside-title { display: flex; align-items: center; gap: 8px; margin-bottom: 13px; font-size: 12px; font-weight: 680; }
    .completeness { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; background: #f8f7ff; }
    .completeness-ring { width: 48px; height: 48px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 50%; background: conic-gradient(var(--accent) 0 82%, #e8e7ef 82% 100%); position: relative; }
    .completeness-ring::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: #f8f7ff; }
    .completeness-ring span { position: relative; z-index: 1; font: 700 11px/1 var(--font-data); }
    .summary-line { display: flex; align-items: flex-start; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 10px; }
    .summary-line:last-child { border-bottom: 0; }
    .summary-check { width: 18px; height: 18px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 50%; background: var(--mint-soft); color: var(--mint); font-size: 9px; }
    .summary-check.pending { background: var(--amber-soft); color: var(--amber); }
    .summary-line strong { display: block; font-size: 10px; }
    .summary-line span { display: block; margin-top: 1px; color: var(--muted); font-size: 8px; }
    .editor-savebar { position: sticky; bottom: 14px; z-index: 10; display: flex; align-items: center; gap: 8px; padding: 11px 12px; border: 1px solid rgba(216,219,229,.9); border-radius: 12px; background: rgba(255,255,255,.94); box-shadow: 0 12px 30px rgba(24,27,39,.12); backdrop-filter: blur(12px); }
    .editor-savebar .spacer { flex: 1; }

    .transcript { display: grid; gap: 11px; }
    .turn { display: grid; grid-template-columns: 30px 1fr; gap: 9px; align-items: start; }
    .turn-avatar { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: #f0f1f4; color: var(--muted); font-size: 9px; font-weight: 700; }
    .turn.agent .turn-avatar { background: var(--accent-soft); color: var(--accent-2); }
    .bubble { max-width: 88%; padding: 10px 11px; border: 1px solid var(--line); border-radius: 4px 12px 12px 12px; background: white; color: var(--ink-2); font-size: 11px; }
    .turn.agent .bubble { border-color: #dedaf9; background: #f9f8ff; }
    .bubble mark { padding: 1px 3px; border-radius: 3px; background: #ffe4e8; color: #a62e3e; }
    .turn-time { margin-top: 4px; color: var(--muted-2); font-size: 9px; }
    .tool-call { margin-left: 39px; padding: 9px 10px; border-left: 2px solid #8d83ec; border-radius: 0 8px 8px 0; background: #f7f6ff; color: var(--muted); font: 10px/1.5 ui-monospace, "Cascadia Mono", monospace; }
    .split-detail { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(300px, .85fr); gap: 16px; }
    .review-panel { align-self: start; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .review-panel .section-head { background: var(--surface-2); }
    .review-item { padding: 11px 13px; border-top: 1px solid var(--line); }
    .review-item-top { display: flex; gap: 8px; align-items: flex-start; }
    .review-item-title { flex: 1; font-size: 11px; font-weight: 620; }
    .review-evidence { margin-top: 5px; color: var(--muted); font-size: 9px; }
    .review-actions { display: flex; gap: 5px; margin-top: 9px; }

    .check-list { display: grid; gap: 8px; }
    .check-item { display: flex; align-items: flex-start; gap: 9px; padding: 10px; border: 1px solid var(--line); border-radius: 9px; }
    .check-status { width: 20px; height: 20px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 50%; background: var(--mint-soft); color: var(--mint); }
    .check-status.blocked { background: var(--red-soft); color: var(--red); }
    .check-copy strong { display: block; font-size: 11px; }
    .check-copy span { color: var(--muted); font-size: 9px; }
    .run-progress { padding: 26px; text-align: center; }
    .run-orbit { width: 76px; height: 76px; margin: 0 auto 18px; position: relative; border: 1px solid #dcd8fa; border-radius: 50%; }
    .run-orbit::before { content: ""; position: absolute; inset: 13px; border: 6px solid var(--accent-soft); border-top-color: var(--accent); border-radius: 50%; animation: spin 1.1s linear infinite; }
    .run-stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; margin-top: 18px; }
    .run-stat { padding: 10px; border-radius: 9px; background: var(--surface-2); }
    .run-stat strong { display: block; font: 680 17px/1.2 var(--font-data); }
    .run-stat span { color: var(--muted); font-size: 9px; }

    .toast { position: fixed; z-index: 120; right: 22px; bottom: 84px; min-width: 280px; max-width: 420px; display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border: 1px solid #d8dbe4; border-radius: 11px; background: rgba(255,255,255,.96); box-shadow: var(--shadow); animation: toastIn .2s ease-out; }
    .toast-icon { width: 22px; height: 22px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 50%; background: var(--mint-soft); color: var(--mint); }
    .toast strong { display: block; margin-bottom: 2px; font-size: 11px; }
    .toast span { color: var(--muted); font-size: 10px; }

    .variant-switcher {
      position: fixed;
      z-index: 110;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 6px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 999px;
      background: rgba(24,26,34,.94);
      color: white;
      box-shadow: 0 12px 30px rgba(24,26,34,.24);
      backdrop-filter: blur(10px);
    }
    .variant-switcher button { width: 30px; height: 30px; display: grid; place-items: center; border: 0; border-radius: 50%; background: rgba(255,255,255,.08); color: white; cursor: pointer; }
    .variant-label { min-width: 168px; text-align: center; font-size: 11px; font-weight: 620; }
    .variant-label small { color: #b9bdc9; font-size: 9px; font-weight: 500; }

    /* Variant B: 顶部导航、宽幅运营台 */

    body.variant-B .sidebar { position: sticky; height: 76px; flex-direction: row; align-items: center; padding: 0 22px; border-right: 0; border-bottom: 1px solid var(--line); }

    body.variant-B .agent-avatar { width: 29px; height: 29px; }

    body.variant-B .topbar { height: 56px; padding-left: 34px; background: rgba(246,247,249,.94); }
    body.variant-B .page { max-width: 1360px; padding-top: 24px; }
    body.variant-B .quality-loop { border-radius: 18px; }
    body.variant-B .quality-loop .loop-track { grid-template-columns: 1.2fr 1fr 1fr 1.2fr; }

    /* Variant C: 图标轨 + 工作队列 + 详情 */
    body.variant-C .app-shell { grid-template-columns: 72px 286px minmax(0,1fr); }
    body.variant-C .sidebar { width: 72px; padding: 18px 10px; align-items: center; }
    body.variant-C .brand { padding: 0 0 20px; }
    body.variant-C .brand > div:last-child, body.variant-C .agent-switcher, body.variant-C .nav-label, body.variant-C .sidebar-help { display: none; }
    body.variant-C .nav-list { gap: 7px; }
    body.variant-C .nav-item { width: 42px; height: 42px; justify-content: center; padding: 0; }
    body.variant-C .nav-item span:not(.nav-icon) { display: none; }
    body.variant-C .nav-icon { width: 19px; height: 19px; }
    body.variant-C .context-panel { display: flex; flex-direction: column; height: 100vh; position: sticky; top: 0; border-right: 1px solid var(--line); background: white; }
    body.variant-C .context-head { padding: 23px 18px 15px; border-bottom: 1px solid var(--line); }
    body.variant-C .context-head h2 { margin: 0 0 4px; font-size: 15px; }
    body.variant-C .context-head p { margin: 0; color: var(--muted); font-size: 10px; }
    body.variant-C .context-list { flex: 1; overflow: auto; padding: 8px; }
    body.variant-C .context-item { width: 100%; padding: 11px; border: 0; border-radius: 9px; background: transparent; text-align: left; cursor: pointer; }
    body.variant-C .context-item:hover, body.variant-C .context-item.active { background: var(--surface-2); }
    body.variant-C .context-item + .context-item { margin-top: 2px; }
    body.variant-C .context-item strong { display: block; font-size: 11px; }
    body.variant-C .context-item span { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; }
    body.variant-C .context-foot { padding: 12px; border-top: 1px solid var(--line); }
    body.variant-C .main { grid-column: 3; }
    body.variant-C .topbar { padding-left: 24px; background: rgba(246,247,249,.94); }
    body.variant-C .page { max-width: 1180px; padding-left: 24px; padding-right: 24px; }
    body.variant-C .grid.cols-4 { grid-template-columns: repeat(2, minmax(0,1fr)); }

    @keyframes slideIn { from { transform: translateX(28px); opacity: .2; } to { transform: translateX(0); opacity: 1; } }
    @keyframes popIn { from { transform: translateY(8px) scale(.985); opacity: .3; } to { transform: translateY(0) scale(1); opacity: 1; } }
    @keyframes spin { to { transform: rotate(360deg); } }

    function currentAgent() {
      return agents.find(x=>x.id===state.agentId) || agents[0];

      return currentAgent().hasProduction ? tests : draftTests;

    function badge(text, tone = '') {
      return `<span class="badge ${tone}">${tone ? '<span class="dot"></span>' : ''}${text}</span>`;
    }

    function riskTone(risk) {
      return ['阻断','上线前必须解决'].includes(risk) ? 'block' : risk === '重要' ? 'warn' : '';
    }

    function resultTone(result) {
      if (['处理正确','已完成','可以测试','已确认解决','整体回归通过','通过','可运行'].includes(result)) return 'pass';
      if (['处理有问题','失败','执行失败'].includes(result)) return 'fail';
      if (['需要人工看一下','测试没有完成','需要处理','待确认','待复核','草稿','异常','修复中','已确认'].includes(result)) return 'review';
      return '';
    }

    function businessResult(result) {
      return ({'通过':'处理正确','失败':'处理有问题','待复核':'需要人工看一下','异常':'测试没有完成','未运行':'尚未测试','执行失败':'测试没有完成','可运行':'可以测试','草稿':'待确认','修复中':'正在修改','已确认':'问题已确认','单条已修复':'这个问题已处理正确','等待整体回归':'等待测试全部重点问题','整体回归通过':'全部重点问题已通过','可关闭':'可以关闭','单条待复测':'等待重新测试','未复测':'尚未重新测试'})[result] || result;
    }

    function businessRisk(risk) {
      return risk === '阻断' ? '上线前必须解决' : risk;

    function renderDiscovery() {
      if(state.onlineView==='rules') return renderRules();
      const data=currentDB();
      const pending=data.candidates.filter(c=>c.status==='待复核');
      const observing=data.candidates.filter(c=>c.status==='继续观察');
      const accepted=data.candidates.filter(c=>['业务可以接受','当前处理可以接受'].includes(c.status));
      const systemProblems=data.problems.filter(p=>p.problemType==='system');
      const agentProblems=data.problems.filter(p=>p.problemType!=='system');
      const confirmedGroups=[['继续观察','证据不足继续观察'],['业务可接受','业务可以接受'],['系统问题','系统和工具问题'],['智能体问题','智能体提示词问题']];
      const toCandidate=list=>list.map(c=>({kind:'candidate',data:c}));
      const toProblem=list=>list.map(p=>({kind:'problem',data:p}));
      let rows=[];
      if(state.discoveryTab==='等待确认'){
        rows=toCandidate(pending);
      }else if(state.discoveryTab==='已经确认'){
        if(state.discoverySub==='业务可接受') rows=toCandidate(accepted);
        else if(state.discoverySub==='系统问题') rows=toProblem(systemProblems);
        else if(state.discoverySub==='智能体问题') rows=toProblem(agentProblems);
        else rows=toCandidate(observing);
      }else{
        rows=[...data.candidates.filter(c=>!c.problemId).map(c=>({kind:'candidate',data:c})),...data.problems.map(p=>({kind:'problem',data:p}))];
      }
      return `<div class="page"><div class="page-head"><div class="page-head-copy"><h1>线上问题</h1></div><div class="page-actions"><button class="btn" data-action="online-view" data-view="rules">${icon('shield',15)}线上检查规则 · ${data.rules.length}</button><button class="btn" data-action="open-discovery-settings">${icon('settings',15)}发现设置</button><button class="btn primary" data-action="analyze">${state.analysisRunning?icon('refresh',15)+'检查中…':icon('spark',15)+'检查最新对话'}</button></div></div>

        checks:draftChecks,draftChecks,productionChecks,createdAt:'刚刚'};

      if(result.humanConclusion==='acceptable') return 'pass';
      if(result.humanConclusion==='case-issue') return 'error';

    function runStats(run) {
      const stats={pass:0,fail:0,review:0,error:0,total:run?run.results.length:0};
      if(!run) return stats;
      run.results.forEach(result=>{
        const effective=effectiveResult(result);
        if(effective==='review'&&result.humanStatus==='已经确认') stats.pass++;
        else stats[effective]++;
      });
      return stats;
    }

    function gateFor(run) {
      if(!run||!run.results.length||run.executionStatus==='已取消') return {tone:'review',title:'暂时无法判断',reason:'任务尚未形成完整结果，不能据此决定是否上线。'};
      const s=runStats(run);
      if(s.fail) return {tone:'fail',title:'暂不建议上线',reason:`仍有 ${s.fail} 个客户问题处理有问题，修好并复测后再判断能否上线。`};
